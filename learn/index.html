<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Serebii Labs 收藏的可离线阅读中文 AI 课程。" />
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="manifest" href="/learn/manifest.webmanifest" />
    <link rel="icon" href="/learn/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/learn/styles.css" />
    <title>AI 学习 · Serebii Labs</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="返回 Serebii Labs 首页"><i class="brand-mark"></i>Serebii Labs</a>
        <nav aria-label="课程库导航"><a href="/">返回首页</a><a href="https://github.com/Serebiisme" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
        <span class="eyebrow">AI Learning / 01</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div>
          <span class="eyebrow">Offline course shelf</span>
          <h1 id="page-title">AI <em>学习</em></h1>
        </div>
        <div class="hero-copy">
          <p>收藏值得反复阅读的中文 AI 课程。完成首次缓存后，即使没有网络，也能继续沿章节阅读。</p>
          <p class="small">当前收录 1 门课程。课程内容与版权归原作者，Serebii Labs 提供离线镜像与阅读入口。</p>
        </div>
      </section>

      <hr class="rule" />
      <section class="catalogue" aria-labelledby="catalogue-title">
        <div class="section-head">
          <h2 id="catalogue-title">课程专辑 / Albums</h2>
          <p id="library-status" role="status" aria-live="polite">正在载入课程…</p>
        </div>
        <div class="course-grid" id="course-grid"></div>
      </section>

      <template id="course-card-template">
        <article class="course-card">
          <div class="course-visual" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="course-meta"><span data-course-number></span><span data-course-chapters></span></div>
          <div class="course-body">
            <p class="course-kicker">Offline course</p>
            <h2 data-course-title></h2>
            <p data-course-author></p>
            <p data-course-source></p>
          </div>
          <div class="course-actions">
            <a class="button button-primary" data-course-link>进入课程</a>
            <a class="button" data-course-license>授权与来源</a>
          </div>
          <p class="offline-status" data-offline-status aria-live="polite">正在检测离线状态…</p>
        </article>
      </template>

      <noscript><p class="notice">课程目录需要 JavaScript；你仍可直接访问 <a href="/learn/ai-agent-book/">第一门课程</a>。</p></noscript>
      <footer><p>© 2026 Serebii Labs</p><p>课程版权归原作者 · Offline mirror with attribution</p></footer>
    </main>
    <script type="module" src="/learn/app.js"></script>
  </body>
</html>
