tml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">Модульная схема данных</span></div></foreignObject><foreignObject x="60" y="343" width="880" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">Базовая схема (voluntary_surrender/compensation/prior_convictions) + расширенная схема по типу преступления</span></div></foreignObject><foreignObject x="60" y="402" width="880" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">(theft→amount_involved, injury→injury_level)</span></div></foreignObject><rect x="24" y="490" width="952" height="468" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="510" width="912" height="41"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">Этап 2: Факторный анализ и моделирование знаний</span></div></foreignObject><rect x="44" y="551" width="272" height="217" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="60" y="567" width="240" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-w