        <rect x="516" y="323" width="460" height="170" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="339" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Расширенный промпт</span></div></foreignObject>
        <foreignObject x="540" y="381" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">Ответьте на вопрос на основе следующих правовых норм:</span> <span data-source-label="17">[Статья 232 Уголовного кодекса...] В: Какое наказание за умышленное убийство?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="509" width="952" height="149" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="525" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Сгенерированный ответ</span></div></foreignObject>
        <foreignObject x="48" y="567" width="904" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">Согласно статье 232 Уголовного кодекса, преступление умышленного убийства наказывается смертной казнью, пожизненным заключением или лишением свободы на срок не менее десяти лет;</span> <span data-source-label="20">если обстоятельства незначительны, наказание — лишение свободы на срок от трёх до десяти лет.</span></div></foreignObject>
