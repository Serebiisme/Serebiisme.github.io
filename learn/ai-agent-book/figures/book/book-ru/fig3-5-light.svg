        <foreignObject x="290" y="105" width="170" height="97"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Плотный поиск + BM25</span> <span data-source-label="4">→ Top-K текстовых фрагментов</span></div></foreignObject>
