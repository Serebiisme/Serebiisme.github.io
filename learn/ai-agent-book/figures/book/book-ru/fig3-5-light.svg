        <foreignObject x="790" y="82" width="170" height="97"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">LLM синтезирует контекст</span> <span data-source-label="10">→ Сгенерировать ответ</span></div></foreignObject>
