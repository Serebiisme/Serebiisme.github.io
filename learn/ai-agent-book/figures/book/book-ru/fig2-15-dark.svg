<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 460" width="820" height="460" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#e4ebf5"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#7c92af"/></marker></defs>


<!-- messages array label -->
<text x="40" y="60" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">messages: [</text>

<!-- Row 1: system -->
<rect x="50" y="78" width="480" height="32" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="94" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "system", content: "Ты агент поддержки клиентов телеком-оператора..." }</text>

<!-- Row 2: tools -->
<rect x="50" y="114" width="480" height="32" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="130" font-family="'Courier New', Courier, monospace" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">инструменты: [cancel_plan, query_records, ...]</text>

<!-- Bracket for "fixed" -->
<path d="M 540,78 C 555,78 555,114 560,123 C 555,132 555,146 540,146" fill="none" stroke="#7c92af" stroke-width="1.5"/>
<text x="570" y="112" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">исправлено</text>
<text x="570" y="130" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">(KV Cache)</text>

<!-- Row 3: user message -->
<rect x="50" y="154" width="480" height="32" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="170" font-family="'Courier New', Courier, monospace" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "user", content: "Помоги мне отменить тариф" }</text>

<!-- Row 4: assistant tool_calls -->
<rect x="50" y="190" width="480" height="32" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="206" font-family="'Courier New', Courier, monospace" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "assistant", tool_calls: [cancel_plan(...)] }</text>

<!-- Row 5: tool result -->
<rect x="50" y="226" width="480" height="32" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="242" font-family="'Courier New', Courier, monospace" font-size="10" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "tool", content: "У этого тарифа есть срок действия договора..." }</text>

<!-- Row 6: assistant text -->
<rect x="50" y="262" width="480" height="32" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="278" font-family="'Courier New', Courier, monospace" font-size="10" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "assistant", content: "Your plan is within the contract period..." }</text>

<!-- Ellipsis row -->
<text x="280" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central">... больше ходов диалога ...</text>

<!-- Row 7: user follow-up -->
<rect x="50" y="322" width="480" height="32" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
<text x="62" y="338" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "user", content: "Затем помоги проверить записи звонков" }</text>
<text x="570" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">уточнение от пользователя</text>

<!-- Row 8: Agent status bar (highlighted) -->
<rect x="50" y="362" width="480" height="48" rx="8" fill="#4c4026" stroke="#7c92af" stroke-width="2.5"/>
<text x="62" y="380" font-family="'Courier New', Courier, monospace" font-size="13" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{ role: "user", content: "&lt;agent_status&gt;</text>
<text x="62" y="398" font-family="'Courier New', Courier, monospace" font-size="11" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">  Вызвано 3/3 раз · TODO: Отменить план (в процессе)&lt;/agent_status&gt;" }</text>

<!-- Arrow pointing to system hint -->
<line x1="570" y1="386" x2="538" y2="386" stroke="#7c92af" stroke-width="2" marker-end="url(#ah)"/>
<text x="578" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Вставка фреймворка агента</text>
<text x="578" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">строка состояния агента</text>

<!-- Closing bracket -->
<text x="40" y="428" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">]</text>

<!-- Generation position arrow and label -->
<line x1="50" y1="422" x2="50" y2="450" stroke="#7c92af" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="442" width="20" height="20" rx="2" fill="#344964" stroke="#7c92af" stroke-width="1"/>
<text x="88" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">модель начинает генерацию отсюда</text>

<!-- Bottom note -->
<rect x="50" y="472" width="720" height="22" rx="8" fill="#273449" stroke="none"/>
<text x="410" y="483" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central">← рядом с началом генерации модели, получает наивысший вес внимания</text>
</svg>