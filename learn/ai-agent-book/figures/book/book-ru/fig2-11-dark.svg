<text x="402.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Спецификация формата XML</text>
<text x="402.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">и технические детали</text>
