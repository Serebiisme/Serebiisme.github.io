<text x="70" y="145" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">        {name: "PDF",  desc: "Извлечение и анализ PDF-документов"}, ...]</text>
