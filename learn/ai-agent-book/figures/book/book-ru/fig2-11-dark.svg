<foreignObject data-connector-caption="true" x="124" y="406" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#b2bfd2;text-align:start;overflow-wrap:anywhere">Нужен детальный метод: «Создать PPT с HTML-шаблоном»</div></foreignObject>
