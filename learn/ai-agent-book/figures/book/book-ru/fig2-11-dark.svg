<text x="637.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">scripts/*.py</text>
<text x="637.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Исполняемые инструменты:</text>
<text x="637.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">thumbnail.py и т.д.</text>
<rect x="100" y="620" width="620" height="35" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2"/>
<text x="410" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Фиксированные метаданные → удобно для KV Cache | Динамический контент добавлен → кэш не инвалидирован</text>
