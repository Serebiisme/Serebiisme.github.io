<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 625" width="820" height="625" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c92af"/></marker></defs>

