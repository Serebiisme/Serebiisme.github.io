<rect x="60" y="280" width="700" height="100" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2"/>
<text x="70" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Основной поток PPTX Skill:</text>
<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. markitdown извлекает текст → 2. Распаковка PPTX для доступа к XML</text>
<text x="70" y="344" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">3. Изменить содержимое slide{N}.xml → 4. Перепаковать в .pptx</text>
<text x="70" y="366" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Ссылки: → html2pptx.md | → reference.md | → scripts/</text>
