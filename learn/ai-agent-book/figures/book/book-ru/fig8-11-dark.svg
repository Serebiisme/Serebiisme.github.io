  </foreignObject>
    <foreignObject x="44" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="1" style="width:100%">Цель: получить разбираемый вывод (JSON/вызов инструмента)</div></div>
  </foreignObject><foreignObject x="44" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="2" style="width:100%">Данные: тысячи качественных демонстраций</div></div>
  </foreignObject><foreignObject x="44" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="3" style="width:100%">Условие остановки: формат стабилен, базовые возможности достигнуты</div></div>
  </foreignObject><foreignObject x="44" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="4" style="width:100%">⚠ Переобучение → Модель коллапсирует к обучающему распределению</div></div>
  </foreignObject>
    <rect x="660" y="20" width="440" height="430" rx="8" fill="#344964" stroke="#7c92af" stroke-width="2"/>
    <foreignObject x="684" y="35" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="7" style="width:100%">Этап 2: Стратегия формирования RL</div></div>
  </foreignObject>
    <foreignObject x="684" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="8" style="width:100%">Цель: максимизировать вознаграждение за задачу (точность/доля успеха)</div></div>
  </foreignObject><foreignObject x="684" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="9" style="width:100%">Предпосылка: формат вывода стабилен → награда вычислима</div></div>
  </foreignObject><foreignObject x="684" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="10" style="width:100%">Прорыв: открытие новых стратегий за пределами демонстраций SFT</div></div>
  </foreignObject><foreignObject x="684" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="11" style="width:100%">✓ Стабильный формат + Обобщение стратегии = Готово к внедрению</div></div>
  </foreignObject>
    <foreignObject x="480" y="154" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="5" style="width:100%">Формат</div></div>
  </foreignObject>
    <foreignObject x="480" y="224" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="6" style="width:100%">Стабильный</div></div>
  </foreignObject>
    <line x1="478" y1="320" x2="642" y2="320" stroke="#7c92af" stroke-width="2.5" marker-end="url(#training-arrow)"/>
    <rect x="20" y="480" width="1080" height="155" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="2"/>
    <foreignObject x="45" y="490" width="1030" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="12" style="width:100%">Почему нельзя пропустить SFT и сразу перейти к RL?</div></div>
  </foreignObject>
    <foreignObject x="50" y="550" width="1020" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="13" style="width:100%">Вывод базовой модели неструктурирован → JSON не парсится → Функция вознаграждения возвращает NaN → Градиенты все нулевые → Обучение полностью проваливается</div></div>
  </foreignObject>
    <foreignObject x="40" y="655" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="14" style="width:100%">SFT запоминает распределение → RL обобщает стратегию</div></div>
  </foreignObject>
    <foreignObject x="40" y="720" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:19px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="15" style="width:100%">SFT: max Σ log P(y|x) (подгонка под обучающее распределение) RL: max E[R(τ)] (оптимизация целевой задачи)</div></div>
  </foreignObject>
    <foreignObject x="40" y="795" width="1040" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="16" style="width:100%">Когда «сколько бы примеров ни добавляли, на новых сценариях результат остаётся плохим» → переломный момент для перехода к RL</div></div>
  </foreignObject>
  </svg>