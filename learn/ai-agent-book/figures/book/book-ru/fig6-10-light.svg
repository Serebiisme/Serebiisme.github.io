<svg data-layout="voice-architecture" data-figure="6-10" xmlns="http://www.w3.org/2000/svg" width="1000" height="1372" viewBox="0 0 1000 1372" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><g data-node="user-input"><rect x="250" y="24" width="500" height="113" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="270" y="44" width="460" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">Ввод пользователя</span></div></foreignObject><foreignObject x="270" y="89" width="460" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">"Какой план выбрать?"</span></div></foreignObject></g><g data-node="parallel-thinking"><rect x="80" y="201" width="840" height="253" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="104" y="221" width="792" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:left;overflow-wrap:anywhere"><span data-source-label="2">Параллельное размышление</span></div></foreignObject><g data-thought-path="fast-thinking"><rect x="104" y="272" width="384" height="162" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="124" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Быстрое мышление ~500мс (размышление выключено)</span></div></foreignObject><foreignObject x="124" y="363" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">"Хорошая цена, рекомендую покупку"</span></div></foreignObject></g><g data-thought-path="slow-thinking"><rect x="512" y="272" width="384" height="162" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Медленное мышление ~8с (режим размышления включён)</span></div></foreignObject><foreignObject x="532" y="363" width="344" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">"Нет международного роуминга, не подходит"</span></div></foreignObject></g></g><path data-edge="input-to-parallel-thinking" data-from="user-input" data-to="parallel-thinking" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="64" d="M500 145 L500 193" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-node="user-experience"><rect x="200" y="542" width="600" height="223" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="220" y="562" width="560" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">Пользовательский опыт</span></div></foreignObject><foreignObject x="220" y="609" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">0.5с: "Хорошая цена, рекомендую покупку"</span></div></foreignObject><foreignObject x="220" y="645" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">8.0с: "Нет международного роуминга, не подходит"</span></div></foreignObject><foreignObject x="220" y="681" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">→ Противоречие!</span></div></foreignObject><foreignObject x="220" y="717" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">→ Пользователь теряет доверие</span></div></foreignObject></g><path data-edge="fast-thinking-to-experience" data-from="fast-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M296 442 V494 H400 V534" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><path data-edge="slow-thinking-to-experience" data-from="slow-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M704 442 V494 H600 V534" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="48" y="805" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Две основные проблемы</span></div></foreignObject><g data-issue="overthinking"><rect x="24" y="856" width="464" height="185" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="876" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Проблема 1: избыточное размышление над простыми задачами</span></div></foreignObject><foreignObject x="44" y="947" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">"Какой сегодня день?" → Быстрое мышление уже верно → Медленное мышление всё равно работает 8 с</span></div></foreignObject></g><g data-issue="inconsistency"><rect x="512" y="856" width="464" height="185" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="876" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Проблема 2: несогласованность между быстрым и медленным</span></div></foreignObject><foreignObject x="532" y="947" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Независимые пути мышления, предположения могут быть совершенно разными</span></div></foreignObject></g><g data-conclusion="advisor-improvement"><rect x="24" y="1081" width="464" height="267" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="1101" width="424" height="83"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">Улучшение: медленное мышление как «советник», направляющий за кулисами</span></div></foreignObject><foreignObject x="44" y="1198" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Медленное мышление → строка состояния агента → быстрое мышление</span></div></foreignObject><foreignObject x="44" y="1257" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Нет прямого конфликта, но коммуникация косвенно неясна</span></div></foreignObject></g><g data-conclusion="fundamental-limitations"><rect x="512" y="1081" width="464" height="267" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="1101" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Всё ещё есть фундаментальные ограничения</span></div></foreignObject><foreignObject x="532" y="1172" width="424" height="97"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">Быстрое мышление может неверно интерпретировать подсказки строки состояния ("Подтвердить цену" →</span> <span data-source-label="22">"Подтвердить у пользователя" вместо "Пересчитать")</span></div></foreignObject><foreignObject x="532" y="1277" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="23">Невозможно достичь естественного взаимодействия «думать во время речи»</span></div></foreignObject></g></svg>