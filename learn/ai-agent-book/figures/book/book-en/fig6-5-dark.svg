%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">Add new requirements to the task</span></div></foreignObject></g><path data-edge="mid-task-update-2-to-3" data-from="mid-task-update-2" data-to="mid-task-update-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 643 H672" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="mid-task-update" data-stage="3"><rect x="680" y="582" width="272" height="122" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="696" y="598" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Adjust subsequent actions</span></div></foreignObject><foreignObject x="696" y="637" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Use existing data and all updates</span></div></foreignObject></g><rect x="24" y="768" width="952" height="115" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="48" y="792" width="904" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Model: understand changes and revise plans. Runtime: tools, state, and event sources.</span></div></foreignObject><foreignObject x="48" y="831" wid