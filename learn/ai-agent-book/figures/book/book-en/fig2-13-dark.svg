<svg xmlns="http://www.w3.org/2000/svg" width="960" height="985" viewBox="0 0 960 985" role="img" aria-labelledby="title desc"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><title id="title">Cache evolution across three turns</title><desc id="desc">Web reading edition of Figure 2-13. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="985"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#e4ebf5;background:#273449;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#b2bfd2;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#1e2836;border:1px solid #7c92af;border-radius:12px;min-width:0}.blue{background:#273449;border-color:#7c92af}.amber{background:#263f61;border-color:#7c92af}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #7c92af;border-radius:7px;margin:8px 0;background:#1e2836}.tag{display:inline-block;border-radius:5px;background:#273449;color:#e4ebf5;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #7c92af;background:#273449;font-size:17px}.arrow{text-align:center;color:#b2bfd2;font-size:23px;padding:7px}.bar{height:10px;background:#263f61;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#b2bfd2}.hit{background:#273449}.new{background:#4c4026;border-color:#7c92af}.pill{float:right;font-size:13px;font-weight:bold;color:#b2bfd2;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>The prefix stays; the trajectory grows</h1><p class="muted">An illustrative append-only session with an available prefix cache.</p><div class="grid three"><div class="card "><h2>Turn 1</h2><div class="row new small"><span class="pill">NEW</span>system</div><div class="row new small"><span class="pill">NEW</span>tools</div><div class="row new small"><span class="pill">NEW</span>user request</div><div class="row new small"><span class="pill">NEW</span>skill catalog</div><div class="row new small"><span class="pill">NEW</span>Skill(pptx)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><div class="row new small"><span class="pill">NEW</span>skill instructions</div><p class="small">New content: ≈ 2.5k tokens</p></div><div class="card "><h2>Turn 2</h2><div class="row hit small"><span class="pill">REUSED</span>system</div><div class="row hit small"><span class="pill">REUSED</span>tools</div><div class="row hit small"><span class="pill">REUSED</span>user request</div><div class="row hit small"><span class="pill">REUSED</span>skill catalog</div><div class="row hit small"><span class="pill">REUSED</span>Skill(pptx)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row hit small"><span class="pill">REUSED</span>skill instructions</div><div class="row new small"><span class="pill">NEW</span>Read(pdf)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><p class="small">New content: ≈ 0.5k tokens</p></div><div class="card "><h2>Turn 3</h2><div class="row hit small"><span class="pill">REUSED</span>system</div><div class="row hit small"><span class="pill">REUSED</span>tools</div><div class="row hit small"><span class="pill">REUSED</span>user request</div><div class="row hit small"><span class="pill">REUSED</span>skill catalog</div><div class="row hit small"><span class="pill">REUSED</span>Skill(pptx)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row hit small"><span class="pill">REUSED</span>skill instructions</div><div class="row hit small"><span class="pill">REUSED</span>Read(pdf)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row new small"><span class="pill">NEW</span>Write(html)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><p class="small">New content: ≈ 0.4k tokens</p></div></div><div class="note"><b>NEW</b> = added content requiring processing. <b>REUSED</b> = unchanged cached prefix. Reuse can still incur cached-input charges; it is not guaranteed after cache expiry, eviction, or a prefix change.</div></div></body></html></foreignObject></svg>