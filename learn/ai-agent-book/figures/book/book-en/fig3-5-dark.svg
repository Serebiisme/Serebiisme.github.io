      <g data-example="retrieved-text">
        <rect x="24" y="254" width="460" height="190" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="270" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Retrieved Text Chunks</span></div></foreignObject>
        <foreignObject x="48" y="312" width="412" height="106"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="14">Article 232 of the Criminal Law: Whoever intentionally commits homicide shall be sentenced to death,</span> <span data-source-label="15">life imprisonment or fixed-term imprisonment of not less than 10 years...</span></div></foreignObject>
      </g>
      <g data-example="augmented-prompt">
        <rect x="516" y="254" width="460" height="190" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="540" y="270" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Augmented Prompt</span></div></foreignObject>
        <foreignObject x="540" y="312" width="412" height="106"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="17">Answer the question based on the following legal provisions:</span> <span data-source-label="18">[Article 232 of the Criminal Law...] Q: What is the sentence for intentional homicide?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="460" width="952" height="149" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="476" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Generated Answer</span></div></foreignObject>
        <foreignObject x="48" y="518" width="904" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="20">According to Article 232 of the Criminal Law, intentional homicide is punishable by death, life imprisonment, or fixed-term imprisonment of not less than 10 years;</span> <span data-source-label="21">if the circumstances are minor, the sentence is fixed-term imprisonment of not less than 3 years but not more than 10 years.</span></div></foreignObject>
      </g></svg>