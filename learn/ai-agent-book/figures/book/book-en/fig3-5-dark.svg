        <foreignObject x="290" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">② Retrieval</span></div></foreignObject>
        <foreignObject x="290" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">Dense Retrieval + BM25</span> <span data-source-label="5">→ Top-K Text Chunks</span></div></foreignObject>
      </g><g data-stage="augmentation">
        <rect x="524" y="24" width="202" height="148" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="540" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">③ Augment</span></div></foreignObject>
        <foreignObject x="540" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">Query + Retrieved Results</span> <span data-source-label="8">→ Construct Complete Prompt</span></div></foreignObject>
      </g><g data-stage="generation">
        <rect x="774" y="24" width="202" height="148" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="790" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">④ Generate</span></div></foreignObject>
        <foreignObject x="790" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">LLM Synthesizes Context</span> <span data-source-label="11">→ Generate Answer</span></div></foreignObject>
