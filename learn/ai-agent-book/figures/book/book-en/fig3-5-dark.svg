<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="633" viewBox="0 0 1000 633" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><g data-stage="query">
        <rect x="24" y="24" width="202" height="148" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
