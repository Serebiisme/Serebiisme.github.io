ir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">After that it is ordinary history and hits the cache</span></div></foreignObject><path data-edge="schema-callout-1" data-card-gap-start="8" data-card-gap-end="8" d="M628 491 H676 V491 H712" fill="none" stroke="#7c92af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ch3-arrow)"/><rect data-callout="2" x="720" y="671" width="256" height="136" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="736" y="687" width="224" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Never remove or reorder tools already loaded</span></div></foreignObject><foreignObject x="736" y="746" width="224" height="45"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Otherwise the cache is invalid from the change onward</span></div></foreignObject><path data-edge="schema-callout-2" data-card-gap-start="8" data-card-gap-end="8" d="M628 739 H676 V739 H712" fill="none" stroke="#7c92af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ch3-arrow)"/></svg>