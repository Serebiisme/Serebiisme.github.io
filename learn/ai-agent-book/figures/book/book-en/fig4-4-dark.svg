re tool definitions: web_search, code_interpreter, tool_search</span></div></foreignObject><rect data-region="append-only-trajectory" x="24" y="268" width="628" height="641" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="44" y="288" width="588" height="37"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Trajectory (append-only; new content goes on the end)</span></div></foreignObject><rect data-trajectory-event="0" x="48" y="341" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="353" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">User: look up the NVDA share price</span></div></foreignObject><rect data-trajectory-event="1" x="48" y="403" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="415" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Assistant: tool_search_call(share price)</span></div></foreignObject><rect data-trajectory-event="2" data-schema-injection="6" x="48" y="465" width="572" height="52" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="477" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">tool_search_output → inject the full get_stock_quote schema</span></div></foreignObject><rect data-trajectory-event="3" x="48" y="527" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="539" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">Assistant: call get_stock_quote → Tool Result</span></div></foreignObject><rect data-trajectory-event="4" x="48" y="589" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="601" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">User: analyze the contributors of a GitHub repo</span></div></foreignObject><rect data-trajectory-event="5" x="48" y="651" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="663" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">Assistant: tool_search_call(GitHub)</span></div></foreignObject><rect data-trajectory-event="6" data-schema-injection="10" x="48" y="713" width="572" height="52" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="725" width="540" heig