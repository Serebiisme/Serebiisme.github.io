xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Tidak ada konflik langsung, namun komunikasi secara tidak langsung tidak jelas</span></div></foreignObject></g><g data-conclusion="fundamental-limitations"><rect x="512" y="1012" width="464" height="221" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="1032" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Masih memiliki keterbatasan mendasar</span></div></foreignObject><foreignObject x="532" y="1077" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">Pemikiran cepat mungkin salah tafsir petunjuk bilah status ("Konfirmasi harga" →</span> <span data-source-label="22">"Konfirmasi pengguna" alih-alih "Hitung ulang")</span></div></foreignObject><foreignObject x="532" y="1159" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="23">Tidak dapat mencapai interaksi alami "berpikir sambil berbicara"</span></div></foreignObject></g></svg>