<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 340" width="800" height="340" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#e4ebf5" /></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#7c92af" /></marker></defs>
<rect x="40" y="50" width="720" height="50" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="60" y="75" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Score(Q,D) = Σ IDF(qi) × TF(qi,D)×(k1+1) / (TF + k1×(1-b+b×|D|/avgdl))</text>
<rect x="40" y="120" width="220" height="170" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="150" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Saturasi term frequency (TF)</text>
<line x1="60" y1="163" x2="240" y2="163" stroke="#7c92af" stroke-width="2" />
<text x="150" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">k₁ mengontrol kecepatan saturasi</text>
<text x="150" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">TF ↑ tetapi kontribusi berkurang</text>
<text x="150" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Kemunculan berlipat ganda</text>
<text x="150" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Skor tidak sampai berlipat ganda</text>
<rect x="290" y="120" width="220" height="170" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="400" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Inverse document frequency (IDF)</text>
<line x1="310" y1="163" x2="490" y2="163" stroke="#7c92af" stroke-width="2" />
<text x="400" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Mengukur kelangkaan kata</text>
<text x="400" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">"the" → IDF ≈ 0</text>
<text x="400" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">"sentencing" → IDF ≈ 5.2</text>
<text x="400" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Bobot kata langka &gt;&gt; kata umum</text>
<rect x="540" y="120" width="220" height="170" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="650" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Normalisasi panjang (b)</text>
<line x1="560" y1="163" x2="740" y2="163" stroke="#7c92af" stroke-width="2" />
<text x="650" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">b ∈ [0,1] kekuatan normalisasi</text>
<text x="650" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">b=0: abaikan panjang</text>
<text x="650" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">b=1: normalisasi penuh</text>
<text x="650" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Menghindari bias terhadap dokumen panjang</text>
<line x1="150" y1="290" x2="150" y2="315" stroke="#7c92af" stroke-width="2" />
<line x1="400" y1="290" x2="400" y2="315" stroke="#7c92af" stroke-width="2" />
<line x1="650" y1="290" x2="650" y2="315" stroke="#7c92af" stroke-width="2" />
<rect x="40" y="315" width="720" height="48" rx="8" fill="#344964" stroke="#7c92af" stroke-width="2" />
<text x="400.0" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Skor akhir = Σ [IDF × TF tersaturasi yang dinormalisasi panjang]</text>
</svg>