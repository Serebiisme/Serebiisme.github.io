<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 625" width="820" height="625" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c92af"/></marker></defs>

<rect x="40" y="70" width="740" height="90" rx="8" fill="#344964" stroke="#7c92af" stroke-width="2" />
<text x="60" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Lapisan 1: Metadata (dimuat saat startup, ~300 token)</text>
<rect x="60" y="108" width="700" height="48" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="70" y="130" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">skills: [{name: "PPTX", desc: "Buat presentasi PowerPoint dari konten"}</text>
<text x="70" y="145" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">        {name: "PDF",  desc: "Extract and analyze PDF documents"}, ...]</text>
<line x1="100" y1="168" x2="100" y2="232" stroke="#7c92af" stroke-width="2" marker-end="url(#ah)" />
