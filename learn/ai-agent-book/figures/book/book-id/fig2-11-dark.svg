<rect x="40" y="240" width="740" height="150" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="60" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Lapisan 2: Alur inti SKILL.md (dimuat sesuai permintaan, ~2K token)</text>
<rect x="60" y="280" width="700" height="100" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="70" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Alur inti PPTX Skill:</text>
<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. markitdown ekstrak teks → 2. Unzip PPTX untuk akses XML</text>
<text x="70" y="344" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">3. Modifikasi konten slide{N}.xml → 4. Kemas ulang sebagai .pptx</text>
<text x="70" y="366" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Referensi: → html2pptx.md | → reference.md | → scripts/</text>
<line x1="100" y1="398" x2="100" y2="462" stroke="#7c92af" stroke-width="2" marker-end="url(#ah)" />
<foreignObject data-connector-caption="true" x="124" y="406" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#b2bfd2;text-align:start;overflow-wrap:anywhere">Butuh metode detail: "Buat PPT dengan templat HTML"</div></foreignObject>
<rect x="40" y="470" width="740" height="140" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="2" stroke-dasharray="8,4" />
<text x="60" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Lapisan 3: Sub-dokumen (pendalaman selektif, dimuat sesuai permintaan)</text>
<rect x="60" y="515" width="215" height="80" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="167.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">html2pptx.md</text>
<text x="167.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Alur kerja lengkap dari</text>
<text x="167.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Templat HTML → PPT</text>
<rect x="295" y="515" width="215" height="80" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="402.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">reference.md</text>
<text x="402.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Spesifikasi format XML</text>
<text x="402.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">dan detail teknis</text>
<rect x="530" y="515" width="215" height="80" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="637.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">scripts/*.py</text>
<text x="637.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Tools yang dapat dieksekusi:</text>
<text x="637.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">thumbnail.py dll.</text>
<rect x="100" y="620" width="620" height="35" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2" />
<text x="410" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Metadata tetap → Ramah KV Cache | Konten dinamis ditambahkan → Cache tidak dibatalkan</text>
