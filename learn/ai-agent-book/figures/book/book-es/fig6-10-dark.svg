<svg data-layout="voice-architecture" data-figure="6-10" xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><g data-node="user-input"><rect x="250" y="24" width="500" height="113" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="270" y="44" width="460" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">Entrada del usuario</span></div></foreignObject><foreignObject x="270" y="89" width="460" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">&quot;¿Qué plan elegir?&quot;</span></div></foreignObject></g><g data-node="parallel-thinking"><rect x="80" y="201" width="840" height="253" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="104" y="221" width="792" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:left;overflow-wrap:anywhere"><span data-source-label="2">Pensamiento paralelo</span></div></foreignObject><g data-thought-path="fast-thinking"><rect x="104" y="272" width="384" height="162" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="124" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Pensamiento rápido ~500ms (pensamiento desactivado)</span></div></foreignObject><foreignObject x="124" y="363" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">&quot;Buen precio, recomiendo compra&quot;</span></div></foreignObject></g><g data-thought-path="slow-thinking"><rect x="512" y="272" width="384" height="162" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Pensamiento lento ~8s (pensamiento activado)</span></div></foreignObject><foreignObject x="532" y="363" width="344" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">&quot;Carece de roaming internacional, no es adecuado&quot;</span></div></foreignObject></g></g><path data-edge="input-to-parallel-thinking" data-from="user-input" data-to="parallel-thinking" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="64" d="M500 145 L500 193" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-node="user-experience"><rect x="200" y="542" width="600" height="223" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="220" y="562" width="560" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">Experiencia de usuario</span></div></foreignObject><foreignObject x="220" y="609" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">0.5s: &quot;Buen precio, recomiendo comprar&quot;</span></div></foreignObject><foreignObject x="220" y="645" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">8.0s: &quot;Carece de roaming internacional, no adecuado&quot;</span></div></foreignObject><foreignObject x="220" y="681" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">→ ¡Contradicción!</span></div></foreignObject><foreignObject x="220" y="717" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">→ El usuario pierde la confianza</span></div></foreignObject></g><path data-edge="fast-thinking-to-experience" data-from="fast-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M296 442 V494 H400 V534" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><path data-edge="slow-thinking-to-experience" data-from="slow-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M704 442 V494 H600 V534" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="48" y="805" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Dos problemas principales</span></div></foreignObject><g data-issue="overthinking"><rect x="24" y="856" width="464" height="159" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="876" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Problema 1: Sobrepensar problemas simples</span></div></foreignObject><foreignObject x="44" y="921" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">&quot;¿Qué día es hoy?&quot; → El pensamiento rápido ya es correcto → El pensamiento lento sigue ejecutándose durante 8s</span></div></foreignObject></g><g data-issue="inconsistency"><rect x="512" y="856" width="464" height="159" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="876" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Problema 2: Inconsistencia entre rápido y lento</span></div></foreignObject><foreignObject x="532" y="921" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Rutas de pensamiento independientes, los supuestos pueden ser completamente diferentes</span></div></foreignObject></g><g data-conclusion="advisor-improvement"><rect x="24" y="1055" width="464" height="221" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="1075" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">Mejora: Pensamiento lento como &quot;asesor&quot; guiando tras bambalinas</span></div></foreignObject><foreignObject x="44" y="1146" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Pensamiento lento → Barra de estado del agente → Pensamiento rápido</span></div></foreignObject><foreignObject x="44" y="1205" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Sin conflicto directo, pero la comunicación es indirectamente vaga</span></div></foreignObject></g><g data-conclusion="fundamental-limitations"><rect x="512" y="1055" width="464" height="221" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="1075" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Aún tiene limitaciones fundamentales</span></div></foreignObject><foreignObject x="532" y="1120" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">El pensamiento rápido puede malinterpretar las pistas de la barra de estado (&quot;Confirmar precio&quot; →</span> <span data-source-label="22">&quot;Confirmar con el usuario&quot; en lugar de &quot;Recalcular&quot;)</span></div></foreignObject><foreignObject x="532" y="1202" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="23">No puede lograr la interacción natural de &quot;pensar mientras se habla&quot;</span></div></foreignObject></g></svg>