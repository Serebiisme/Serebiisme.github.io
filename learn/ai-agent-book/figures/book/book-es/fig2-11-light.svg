<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 625" width="820" height="625" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7386a0"/></marker></defs>

<rect x="40" y="70" width="740" height="90" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
<text x="60" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Capa 1: Metadatos (cargados al inicio, ~300 tokens)</text>
<rect x="60" y="108" width="700" height="48" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="130" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">skills: [{name: "PPTX", desc: "Crear presentaciones PowerPoint desde contenido"}</text>
<text x="70" y="145" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">        {name: "PDF",  desc: "Extraer y analizar documentos PDF"}, ...]</text>
<line x1="100" y1="168" x2="100" y2="232" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<foreignObject data-connector-caption="true" x="124" y="176" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#52627a;text-align:start;overflow-wrap:anywhere">Tarea activadora: "Generar PPT desde un artículo"</div></foreignObject>
<rect x="40" y="240" width="740" height="150" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="60" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Capa 2: Flujo principal de SKILL.md (bajo demanda, ~2K tokens)</text>
<rect x="60" y="280" width="700" height="100" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Flujo principal de PPTX Skill:</text>
<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. markitdown extrae texto → 2. Descomprimir PPTX para acceder al XML</text>
<text x="70" y="344" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">3. Modificar slide{N}.xml → 4. Volver a empaquetar como .pptx</text>
<text x="70" y="366" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Referencias: → html2pptx.md | → reference.md | → scripts/</text>
<line x1="100" y1="398" x2="100" y2="462" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<foreignObject data-connector-caption="true" x="124" y="406" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#52627a;text-align:start;overflow-wrap:anywhere">Método detallado: "Crear PPT con una plantilla HTML"</div></foreignObject>
<rect x="40" y="470" width="740" height="140" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2" stroke-dasharray="8,4"/>
<text x="60" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">Capa 3: Subdocumentos (consulta selectiva, bajo demanda)</text>
<rect x="60" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="167.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">html2pptx.md</text>
<text x="167.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Flujo completo para</text>
<text x="167.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">plantilla HTML → PPT</text>
<rect x="295" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="402.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">reference.md</text>
<text x="402.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Especificación del formato XML</text>
<text x="402.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">y detalles técnicos</text>
<rect x="530" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="637.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">scripts/*.py</text>
<text x="637.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Herramientas ejecutables:</text>
<text x="637.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">thumbnail.py, etc.</text>
<rect x="100" y="620" width="620" height="35" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="410" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Metadatos fijos → favorecen KV Cache | Contenido dinámico añadido → no invalida la caché</text>
</svg>
