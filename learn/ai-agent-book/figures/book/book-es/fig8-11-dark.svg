  </foreignObject><foreignObject x="44" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="2" style="width:100%">Datos: Miles de demostraciones de alta calidad</div></div>
  </foreignObject><foreignObject x="44" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="3" style="width:100%">Condición de parada: Formato estable, capacidad básica lograda</div></div>
  </foreignObject><foreignObject x="44" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#e4ebf5;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="4" style="width:100%">⚠ Sobreentrenamiento → El modelo colapsa a la distribución de entrenamiento</div></div>
  </foreignObject>
