        <foreignObject x="48" y="483" width="904" height="62"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="20">Según el Código Penal Art 232, el homicidio intencional se castiga con prisión de 10 a 25 años;</span> <span data-source-label="21">en circunstancias atenuantes, la pena puede reducirse de 3 a 10 años.</span></div></foreignObject>
