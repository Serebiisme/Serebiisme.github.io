<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 940 300" width="940" height="300" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7386a0"/></marker></defs>
<rect x="30" y="66" width="380" height="210" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2"/>
<text x="220" y="90" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Request(에이전트 프레임워크가 구성)</text>
<rect x="50" y="112" width="340" height="62" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="132" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">system</text>
<text x="70" y="154" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">개발자가 작성한 규칙</text>
<rect x="50" y="190" width="340" height="62" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="210" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">user</text>
<text x="70" y="232" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">&quot;안녕하세요. 누구세요?&quot;</text>
<line x1="418" y1="171" x2="522" y2="171" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<text x="470" y="149" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle">호출</text>
<rect x="530" y="66" width="380" height="210" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2"/>
<text x="720" y="90" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Response(API 응답)</text>
<rect x="550" y="150" width="340" height="82" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="570" y="174" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">assistant</text>
<text x="570" y="198" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">모델이 생성한 응답</text>
<text x="570" y="218" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">&quot;안녕하세요! 저는 코딩 어시스턴트입니다…&quot;</text>
<text x="470" y="308" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">각 호출은 무상태입니다. 모델에 필요한 모든 정보를 요청의 messages 목록에 빠짐없이 제공해야 합니다.</text>
</svg>
