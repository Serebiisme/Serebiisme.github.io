  </foreignObject>
    <foreignObject x="40" y="720" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:19px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="15" style="width:100%">SFT: max Σ log P(y|x)(학습 분포 적합) RL: max E[R(τ)](작업 목표 최적화)</div></div>
  </foreignObject>
    <foreignObject x="40" y="795" width="1040" height="64">
