  </foreignObject>
    <foreignObject x="50" y="550" width="1020" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#b2bfd2;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="13" style="width:100%">기반 모델 출력이 비구조적 → JSON 파싱 불가 → 보상 함수가 NaN 반환 → 그래디언트 0 → 학습 완전 실패</div></div>
  </foreignObject>
