  <title id="title">에이전트–환경 상호작용 루프</title>
  <desc id="desc">에이전트는 Harness가 둘러싼 모델로 구성됩니다. 환경은 에이전트에 관찰을 반환하고 에이전트는 환경에 행동을 보냅니다. Harness는 상호작용을 중개하지만 환경 자체를 포함하지 않습니다.</desc>
