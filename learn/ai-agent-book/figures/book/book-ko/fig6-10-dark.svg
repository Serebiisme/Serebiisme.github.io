ser-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M296 393 V445 H400 V485" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><path data-edge="slow-thinking-to-experience" data-from="slow-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M704 393 V445 H600 V485" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="48" y="756" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">두 가지 문제</span></div></foreignObject><g data-issue="overthinking"><rect x="24" y="807" width="464" height="136" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="827" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">문제 1: 간단한 질문을 지나치게 생각함</span></div></foreignObject><foreignObject x="44" y="872" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">&quot;오늘 무슨 요일?&quot;→빠른 사고 정답→느린 사고는 8s간 계속</span></div></foreignObject></g><g data-issue="inconsistency"><rect x="512" y="807" width="464" height="136" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="827" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="