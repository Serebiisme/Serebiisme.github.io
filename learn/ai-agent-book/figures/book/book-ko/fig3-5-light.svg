<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><g data-stage="query">
