        <foreignObject x="540" y="290" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">다음 법조문을 바탕으로 답하세요:</span> <span data-source-label="17">[《형법》 제232조...] 질문: 고의살인죄의 형량은?</span></div></foreignObject>
