        <foreignObject x="48" y="460" width="904" height="62"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">《형법》 제232조에 따라 고의살인죄는 사형, 무기징역 또는 10년 이상의 유기징역에 처합니다.</span> <span data-source-label="20">사안이 경미하면 3년 이상 10년 이하의 유기징역에 처합니다.</span></div></foreignObject>
