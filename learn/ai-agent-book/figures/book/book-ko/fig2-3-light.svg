<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 900 490" width="900" height="490" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
