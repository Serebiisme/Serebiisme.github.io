<svg data-layout="async-architecture" data-figure="6-5" xmlns="http://www.w3.org/2000/svg" width="1000" height="1034" viewBox="0 0 1000 1034" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><rect x="24" y="24" width="952" height="272" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="48" y="48" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">இணக்கம்: இயக்கச்சூழல் ஒத்திசைவற்ற பணியை ஒழுங்குபடுத்தும்</span></div></foreignObject><g data-flow="compatibility" data-stage="1"><rect x="48" y="101" width="272" height="171" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="64" y="117" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">பணி பின்னணியில் இயங்கும்</span></div></foreignObject><foreignObject x="64" y="182" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">முடியாத நிலையைப் பதிவு செய்</span></div></foreignObject></g><path data-edge="compatibility-1-to-2" data-from="compatibility-1" data-to="compatibility-2" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M328 186.5 H356" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="compatibility" data-stage="2"><rect x="364" y="101" width="272" height="171" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="117" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">புதிய நிகழ்வுகளைப் பெறு</span></div></foreignObject><foreignObject x="380" y="182" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">வரிசை, குறுக்கீடு, இணை இயக்கம்</span></div></foreignObject></g><path data-edge="compatibility-2-to-3" data-from="compatibility-2" data-to="compatibility-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 186.5 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="compatibility" data-stage="3"><rect x="680" y="101" width="272" height="171" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="117" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">மாதிரி பணியைத் தொடரும்</span></div></foreignObject><foreignObject x="696" y="182" width="240" height="74"><div xmlns="http://w