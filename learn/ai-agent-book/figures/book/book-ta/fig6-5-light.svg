dth="2" marker-end="url(#ch3-arrow)"/><g data-flow="work-while-waiting" data-stage="2"><rect x="364" y="458" width="272" height="148" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="474" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">காத்திருக்கும்போதே பணியாற்று</span></div></foreignObject><foreignObject x="380" y="539" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">நிரலும் தயாரிப்புப் பட்டியலும் அமை</span></div></foreignObject></g><path data-edge="work-while-waiting-2-to-3" data-from="work-while-waiting-2" data-to="work-while-waiting-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 532 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="work-while-waiting" data-stage="3"><rect x="680" y="458" width="272" height="148" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="474" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">முடிவுகள் வந்ததும் தீர்மானி</span></div></foreignObject><foreignObject x="696" y="539" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">உண்மைத் தகவலுடன் ஒப்பிடு</span></div></foreignObject></g><g data-flow="mid-task-update" data-stage="1"><rect x="48" y="634" width="272" height="148" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="64" y="650" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">பயனர் தேவைகளைச் சேர்ப்பார்</span></div></foreignObject><foreignObject x="64" y="715" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">பட்ஜெட், எண்ணிக்கை மாற்றம்</span></div></foreignObject></g><path data-edge="mid-task-update-1-to-2" data-from="mid-task-update-1" data-to="mid-task-update-2" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M328 708 H356" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="mid-task-update" data-stage="2"><rect x="364" y="634" width="272" height="148" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="650" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">முடிந்த வேலையைப் பாதுகா</span></div></foreignObject><foreignObject x="380" y="715" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">புதிய தேவைகளைப் பணியில் சேர்</span></div></foreignObject></g><path data-edge="mid-task-update-2-to-3" data-from="mid-task-update-2" data-to="mid-task-update-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 708 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="mid-task-update" data-stage="3"><rect x="680" y="634" width="272" height="148" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="650" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">அடுத்த செயல்களை மாற்று</span></div></foreignObject><foreignObject x="696" y="715" width="240" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">தகவல், புதுப்பிப்புகளை இணை</span></div></foreignObject></g><rect x="24" y="846" width="952" height="164" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="48" y="870" width="904" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">மாதிரி மாற்றத்தைப் புரிந்து திட்டமிடும்; இயக்கச்சூழல் கருவி, நிலை, நிகழ்வு மூலங்களை நிர்வகிக்கும்</span></div></foreignObject><foreignObject x="48" y="935" width="904" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">செய்திகளைப் பெறுவதுடன், பணியைச் சரியாகத் தொடரவும் செயல்களைக் கட்டுப்படுத்தவும் வேண்டும்.</span></div></foreignObject></svg>