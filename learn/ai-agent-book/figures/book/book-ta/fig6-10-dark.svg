<svg data-layout="voice-architecture" data-figure="6-10" xmlns="http://www.w3.org/2000/svg" width="1000" height="1248" viewBox="0 0 1000 1248" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><g data-node="user-input"><rect x="250" y="24" width="500" height="113" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="270" y="44" width="460" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">User input</span></div></foreignObject><foreignObject x="270" y="89" width="460" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">&amp;quot;Which plan to choose?&amp;quot;</span></div></foreignObject></g><g data-node="parallel-thinking"><rect x="80" y="201" width="840" height="227" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="104" y="221" width="792" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:left;overflow-wrap:anywhere"><span data-source-label="2">Parallel thinking</span></div></foreignObject><g data-thought-path="fast-thinking"><rect x="104" y="272" width="384" height="136" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="124" y="292" width="344" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Fast thinking ~500ms (thinking off)</span></div></foreignObject><foreignObject x="124" y="337" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">&amp;quot;Good price, recommend purchase&amp;quot;</span></div></foreignObject></g><g data-thought-path="slow-thinking"><rect x="512" y="272" width="384" height="136" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="292" width="344" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Slow thinking ~8s (thinking on)</span></div></foreignObject><foreignObject x="532" y="337" width="344" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">&amp;quot;Lacks international roaming, not suitable&amp;quot;</span></div></foreignObject></g></g><path data-edge="input-to-parallel-thinking" data-from="user-input" data-to="parallel-thinking" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="64" d="M500 145 L500 193" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-node="user-experience"><rect x="200" y="516" width="600" height="223" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="220" y="536" width="560" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">User experience</span></div></foreignObject><foreignObject x="220" y="583" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">0.5s: &amp;quot;Good price, recommend purchase&amp;quot;</span></div></foreignObject><foreignObject x="220" y="619" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">8.0s: &amp;quot;Lacks international roaming, not suitable&amp;quot;</span></div></foreignObject><foreignObject x="220" y="655" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">→ Contradiction!</span></div></foreignObject><foreignObject x="220" y="691" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">→ User loses trust</span></div></foreignObject></g><path data-edge="fast-thinking-to-experience" data-from="fast-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M296 416 V468 H400 V508" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><path data-edge="slow-thinking-to-experience" data-from="slow-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M704 416 V468 H600 V508" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="48" y="779" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Two major issues</span></div></foreignObject><g data-issue="overthinking"><rect x="24" y="830" width="464" height="136" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="850" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Issue 1: Overthinking simple problems</span></div></foreignObject><foreignObject x="44" y="895" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">&amp;quot;What day is it today?&amp;quot; → Fast thinking already correct → Slow thinking still runs for 8s</span></div></foreignObject></g><g data-issue="inconsistency"><rect x="512" y="830" width="464" height="136" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="850" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Issue 2: Inconsistency between fast and slow</span></div></foreignObject><foreignObject x="532" y="895" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Independent thinking paths, assumptions may be completely different</span></div></foreignObject></g><g data-conclusion="advisor-improvement"><rect x="24" y="1006" width="464" height="218" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="1026" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">Improvement: Slow thinking as &amp;quot;advisor&amp;quot; guiding behind the scenes</span></div></foreignObject><foreignObject x="44" y="1097" width="424" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Slow thinking → Agent status bar → Fast thinking</span></div></foreignObject><foreignObject x="44" y="1133" width="424" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">No direct conflict, but communication is indirectly vague</span></div></foreignObject></g><g data-conclusion="fundamental-limitations"><rect x="512" y="1006" width="464" height="218" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="1026" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Still has fundamental limitations</span></div></foreignObject><foreignObject x="532" y="1071" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">Fast thinking may misinterpret status bar hints (&amp;quot;Confirm price&amp;quot; →</span> <span data-source-label="22">&amp;quot;Confirm with user&amp;quot; instead of &amp;quot;Recalculate&amp;quot;)</span></div></foreignObject><foreignObject x="532" y="1153" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="23">Cannot achieve natural interaction of &amp;quot;thinking while speaking&amp;quot;</span></div></foreignObject></g></svg>