  </foreignObject>
    <line x1="48" y1="184" x2="292" y2="184" stroke="#7386a0" stroke-width="1.5"/>
    <foreignObject data-label="6" x="42" y="196" width="256" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" style="width:100%;unicode-bidi:plaintext">இயல்பு, சுருக்கம், விதிக்கு உட்பட்ட மாற்று வழி</div></div>
  </foreignObject>
  </g><g data-verifier="process" data-layer-position="middle" data-labels="3 4">
    <rect data-verifier-card="process" x="20" y="330" width="300" height="180" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
    <foreignObject data-label="3" x="42" y="350" width="256" height="54">
