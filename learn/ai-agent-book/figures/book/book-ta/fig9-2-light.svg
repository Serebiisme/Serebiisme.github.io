    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:700;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">பரிமாண வாரியான மதிப்பீடு</div></div>
