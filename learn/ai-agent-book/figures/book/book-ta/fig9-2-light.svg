    <foreignObject data-label="18" x="1042" y="370" width="236" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" style="width:100%;unicode-bidi:plaintext">வெற்றி தோல்வியின் இடத்தைத் தக்கவைக்கும்</div></div>
