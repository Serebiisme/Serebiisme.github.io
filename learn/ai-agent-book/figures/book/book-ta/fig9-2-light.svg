    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:700;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">சான்றின் இடம்</div></div>
  </foreignObject>
          <foreignObject data-label="13" x="466" y="441" width="398" height="58">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">உரையாடல் சுற்றையும் கருவி நிலையையும் குறி</div></div>
  </foreignObject>
          <line x1="466" y1="506" x2="864" y2="506" stroke="#7386a0" stroke-width="1"/>
        </g><g data-evaluation-field="failure" data-labels="14 15">
