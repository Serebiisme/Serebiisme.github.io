  </foreignObject>
    <foreignObject data-label="20" x="1042" y="514" width="236" height="76">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" style="width:100%;unicode-bidi:plaintext">புதுப்பிக்கும் இலக்கைத் தனி தொகுதி தேர்வு செய்யட்டும்</div></div>
