  </foreignObject>
    <line x1="48" y1="644" x2="292" y2="644" stroke="#7386a0" stroke-width="1.5"/>
    <foreignObject data-label="2" x="42" y="656" width="256" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" style="width:100%;unicode-bidi:plaintext">சோதனைகள், தொகைகள், ஆர்டரின் இறுதி நிலை</div></div>
  </foreignObject>
  </g>

