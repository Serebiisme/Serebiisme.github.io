<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" role="img" aria-labelledby="trajectory-verification-title" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
  <title id="trajectory-verification-title">மூன்று அடுக்கு பாதை சரிபார்ப்பு: சான்று நிஜச் சூழலிலிருந்து வரட்டும்</title>
  <defs>
  <marker id="evolution-methods-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 4, 0 8" fill="#203047"/></marker>
</defs>

  <foreignObject data-label="0" x="20" y="14" width="1280" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:25px;font-weight:700;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" style="width:100%;unicode-bidi:plaintext">மூன்று அடுக்கு பாதை சரிபார்ப்பு: சான்று நிஜச் சூழலிலிருந்து வரட்டும்</div></div>
  </foreignObject>

  <g data-verifier="rubric" data-layer-position="top" data-labels="5 6">
    <rect data-verifier-card="rubric" x="20" y="100" width="300" height="180" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
