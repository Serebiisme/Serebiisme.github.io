    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:700;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">தோல்விச் சிட்டைகள்</div></div>
  </foreignObject>
          <foreignObject data-label="15" x="466" y="546" width="398" height="58">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">பிந்தைய கண்டறிதலுக்கு சிக்கல் வகையை வைத்திரு</div></div>
  </foreignObject>
          
        </g>
    <line x1="462" y1="628" x2="868" y2="628" stroke="#7386a0" stroke-width="1.5"/>
