          <foreignObject data-label="8" x="466" y="197" width="398" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:700;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">பணி முடிவு</div></div>
  </foreignObject>
          <foreignObject data-label="9" x="466" y="231" width="398" height="58">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.32;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:start"><div dir="auto" style="width:100%;unicode-bidi:plaintext">வெற்றி, பகுதி வெற்றி அல்லது தோல்வி</div></div>
  </foreignObject>
          <line x1="466" y1="296" x2="864" y2="296" stroke="#7386a0" stroke-width="1"/>
        </g><g data-evaluation-field="dimensions" data-labels="10 11">
