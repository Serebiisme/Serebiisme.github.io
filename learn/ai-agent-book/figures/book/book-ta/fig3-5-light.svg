      <g data-edge="query-to-retrieval" data-from="query" data-to="retrieval"><path d="M234 98 L266 98" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="retrieval-to-augmentation" data-from="retrieval" data-to="augmentation"><path d="M484 98 L516 98" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="augmentation-to-generation" data-from="augmentation" data-to="generation"><path d="M734 98 L766 98" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g>
