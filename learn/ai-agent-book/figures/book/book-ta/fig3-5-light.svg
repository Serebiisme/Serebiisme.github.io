      </g><g data-stage="retrieval">
        <rect x="274" y="24" width="202" height="148" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="290" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">② Retrieval</span></div></foreignObject>
        <foreignObject x="290" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Dense Retrieval + BM25</span> <span data-source-label="4">→ Top-K Text Chunks</span></div></foreignObject>
      </g><g data-stage="augmentation">
        <rect x="524" y="24" width="202" height="148" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">③ Augment</span></div></foreignObject>
        <foreignObject x="540" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">Query + Retrieved Results</span> <span data-source-label="7">→ Construct Full Prompt</span></div></foreignObject>
      </g><g data-stage="generation">
        <rect x="774" y="24" width="202" height="148" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="790" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">④ Generate</span></div></foreignObject>
        <foreignObject x="790" y="82" width="170" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">LLM synthesizes context</span> <span data-source-label="10">→ Generate response</span></div></foreignObject>
