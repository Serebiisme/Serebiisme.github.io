      <g data-example="retrieved-text">
        <rect x="24" y="254" width="460" height="170" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="270" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Retrieved text chunks</span></div></foreignObject>
        <foreignObject x="48" y="312" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="13">Article 232 of the Criminal Law: Whoever intentionally kills another shall be sentenced to death,</span> <span data-source-label="14">life imprisonment or fixed-term imprisonment of not less than ten years...</span></div></foreignObject>
      </g>
      <g data-example="augmented-prompt">
        <rect x="516" y="254" width="460" height="170" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="270" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Augmented Prompt</span></div></foreignObject>
        <foreignObject x="540" y="312" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">Answer the question based on the following legal provisions:</span> <span data-source-label="17">[Article 232 of the Criminal Law...] Q: What is the sentence for intentional homicide?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="440" width="952" height="170" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="456" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Generated response</span></div></foreignObject>
        <foreignObject x="48" y="498" width="904" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">According to Article 232 of the Criminal Law, the crime of intentional homicide is punishable by death, life imprisonment, or fixed-term imprisonment of not less than ten years;</span> <span data-source-label="20">if the circumstances are minor, the sentence is fixed-term imprisonment of not less than three years but not more than ten years.</span></div></foreignObject>
      </g></svg>