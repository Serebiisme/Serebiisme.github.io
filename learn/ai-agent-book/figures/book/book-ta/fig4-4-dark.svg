<svg data-layout="tool-cache" data-figure="4-4" xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><rect data-region="static-prefix" x="24" y="24" width="952" height="241" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="48" y="44" width="904" height="66"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">நிலையான முன்னொட்டு (பைட் அளவில் மாறாதது, KV Cache தொடர்ந்து பொருந்தும்)</span></div></foreignObject><rect data-prefix-row="0" x="48" y="126" width="904" height="55" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="138" width="872" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">System Prompt</span></div></foreignObject><rect data-prefix-row="1" x="48" y="193" width="904" height="52" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="205" width="872" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">மைய கருவி வரையறைகள்: web_search, code_interpreter, tool_search</span></div></foreignObject><rect data-region="append-only-trajectory" x="24" y="297" width="628" height="739" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="44" y="317" width="588" height="66"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">பாதை (சேர்ப்பது மட்டும்; புதியது இறுதியில் இணைக்கப்படும்)</span></div></foreignObject><rect data-trajectory-event="0" x="48" y="399" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="411" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">User: NVDA பங்கு விலையை வினவு</span></div></foreignObject><rect data-trajectory-event="1" x="48" y="461" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="473" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Assistant: tool_search_call(பங்கு விலை)</span></div></foreignObject><rect data-trajectory-event="2" data-schema-injection="6" x="48" y="523" width="572" height="75" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="535" width="540" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-