"829" width="540" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">tool_search_output → list_contributors போன்ற schema ஐ செலுத்து</span></div></foreignObject><rect data-trajectory-event="7" x="48" y="902" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="914" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">Assistant: அழை → Tool Result → பதில்</span></div></foreignObject><rect data-trajectory-event="8" x="48" y="964" width="572" height="52" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="64" y="976" width="540" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">… இச்சுற்றின் சமீபத்திய உள்ளடக்கம்</span></div></foreignObject><rect data-callout="1" x="720" y="459.5" width="256" height="202" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="736" y="475.5" width="224" height="97"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">முதல் தோற்றம்: ஒருமுறை prefill (இடையகத்தில் எழுதல்)</span></div></foreignObject><foreignObject x="736" y="580.5" width="224" height="65"><div xml