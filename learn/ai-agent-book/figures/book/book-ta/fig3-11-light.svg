      <foreignObject x="32" y="484" width="936" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#52627a;text-align:start;overflow-wrap:anywhere"><span data-source-label="15">· பல்படி பகுத்தறிவு: “என் பல் மருத்துவர் பணிபுரியும் மருத்துவமனையின் முகவரி” இப்பாதையைப் பின்பற்றும்</span> <span data-source-label="16">பயனர் → டாக்டர் ஜாங்-A → ரென்ஆய் வாய் மருத்துவமனை → முகவரி.</span> <span data-source-label="17">· பொருள் தெளிவாக்கம்: உறவு விளிம்புகள் இரு “டாக்டர் ஜாங்” முனைகளை வேறுபடுத்தும்.</span> <span data-source-label="18">ஒவ்வொரு விளிம்பும் எழுவாய்–உறவு–செயப்படுபொருள் மூவணி.</span></div></foreignObject>
