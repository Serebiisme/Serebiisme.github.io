<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 900 490" width="900" height="490" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7386a0"/></marker></defs>
<text x="30" y="78" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">முதல் மாதிரி API அழைப்பு</text>
<rect x="30" y="92" width="340" height="106" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="200" y="118" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">messages: system + user</text>
<text x="200" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">tools: get_current_time,</text>
<text x="200" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_weather</text>
<line x1="378" y1="145" x2="472" y2="145" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle">API</text>
<rect x="480" y="92" width="390" height="106" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
<text x="675" y="112" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">assistant: tool_calls</text>
<text x="675" y="138" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_current_time(timezone=&quot;America/Vancouver&quot;)</text>
<text x="675" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_weather(city=&quot;Vancouver&quot;, unit=&quot;celsius&quot;)</text>
<text x="675" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">தரவு சார்பு இல்லை → இணையாக இயக்கலாம்</text>
<line x1="675" y1="206" x2="675" y2="242" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<rect x="480" y="250" width="390" height="50" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="675" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Agent framework இரண்டு tools-ஐ இணையாக இயக்குகிறது</text>
<line x1="675" y1="308" x2="675" y2="352" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<text x="30" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">இரண்டாவது மாதிரி API அழைப்பு</text>
<rect x="480" y="360" width="390" height="78" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="675" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">messages: + tool முடிவுகள்</text>
<text x="675" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Vancouver நேரம் மற்றும் வானிலை</text>
<text x="675" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Message history-இல் சேர்த்து, model-ஐ மீண்டும் கோரவும்</text>
<line x1="472" y1="399" x2="378" y2="399" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle">API</text>
<rect x="30" y="360" width="340" height="78" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
<text x="200" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">assistant: இறுதிப் பதில்</text>
<text x="200" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Tool call இல்லை → loop முடிவு</text>
<text x="200" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">&quot;இப்போது…, வானிலை…&quot;</text>
<text x="450" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Stateless API-இல் ஒவ்வொரு சுற்றிலும் முழு message history-ஐ model-க்கு மீண்டும் அனுப்ப வேண்டும்</text>
</svg>
