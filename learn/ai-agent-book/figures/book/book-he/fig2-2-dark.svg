<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 940 300" width="940" height="300" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c92af"/></marker></defs>
<rect x="30" y="66" width="380" height="210" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="2"/>
<text x="220" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Request (constructed by the agent framework)</text>
<rect x="50" y="112" width="340" height="62" rx="8" fill="#344964" stroke="#7c92af" stroke-width="2"/>
<text x="70" y="132" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">system</text>
<text x="70" y="154" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">Rules written by the developer</text>
<rect x="50" y="190" width="340" height="62" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2"/>
<text x="70" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">user</text>
<text x="70" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">"Hello, who are you?"</text>
<line x1="418" y1="171" x2="522" y2="171" stroke="#7c92af" stroke-width="2" marker-end="url(#ah)"/>
<text x="470" y="149" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle">Call</text>
<rect x="530" y="66" width="380" height="210" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="2"/>
<text x="720" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">Response (returned by the API)</text>
<rect x="550" y="150" width="340" height="82" rx="8" fill="#273449" stroke="#7c92af" stroke-width="2"/>
<text x="570" y="174" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">assistant</text>
<text x="570" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">Model-generated reply</text>
<text x="570" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">"Hi! I'm a coding assistant…"</text>
<text x="470" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Each call is stateless — all information needed by the model must be fully provided in the request's messages list</text>
</svg>
