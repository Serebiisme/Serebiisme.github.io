-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="30">Mistura de código + screenshot → dispersão de atenção</span></div></foreignObject></g><g data-benefit="separation-advantages"><rect x="348" y="617" width="304" height="230" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="368" y="637" width="264" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="31">Vantagens da Separação</span></div></foreignObject><foreignObject x="368" y="684" width="264" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="32">Contexto independente do Reviewer → apenas screenshots + código</span></div></foreignObject><foreignObject x="368" y="768" width="264" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="33">Proposer foca no código → recebe apenas sugestões de modificação</span></div></foreignObject></g><g data-benefit="actual-effect"><rect x="672" y="617" width="304" height="230" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="692" y="637" width="264" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="34">Efeito Real</span></div></foreignObject><foreignObject x="692" y="684" width="264" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="35">Reduz significativamente o uso de contexto</span></div></foreignObject><foreignObject x="692" y="745" width="264" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="36">A precisão das correções melhora significativamente</span></div></foreignObject></g></svg>