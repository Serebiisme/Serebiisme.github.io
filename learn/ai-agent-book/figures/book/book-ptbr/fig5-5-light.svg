:#203047;text-align:left;overflow-wrap:anywhere"><span data-source-label="22">✗ Slide 3: Texto ultrapassa a coluna direita</span></div></foreignObject><foreignObject x="624.8" y="414" width="315.2" height="25"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:left;overflow-wrap:anywhere"><span data-source-label="23">✗ Slide 7: Conteúdo muito denso</span></div></foreignObject></g></g><g data-review-loop="true" data-gutter-size="144"><foreignObject data-arrow-caption="24" x="440" y="116" width="120" height="25"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="24">Código Slidev</span></div></foreignObject><path data-edge="proposer-to-reviewer" data-from="proposer" data-to="reviewer" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-direction="forward" data-gutter-size="144" d="M436 149 L564 149" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect data-iteration-badge="true" x="436" y="193" width="128" height="61" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="448" y="201" width="104" height="45"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="26">Iterar 2-3 rodadas</span></div></foreignObject><foreignObject data-arrow-caption="25" x="440" y="282" width="120" height="45"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-