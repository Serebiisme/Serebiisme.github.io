        <foreignObject x="48" y="271" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Trechos de Texto Recuperados</span></div></foreignObject>
        <foreignObject x="48" y="313" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="14">Artigo 232 do Código Penal: Quem cometer homicídio doloso será condenado à morte,</span> <span data-source-label="15">prisão perpétua ou pena de prisão de duração determinada não inferior a 10 anos...</span></div></foreignObject>
