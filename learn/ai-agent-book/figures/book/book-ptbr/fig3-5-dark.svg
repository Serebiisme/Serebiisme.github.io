        <foreignObject x="540" y="271" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Prompt Aumentado</span></div></foreignObject>
        <foreignObject x="540" y="313" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="17">Responda à pergunta com base nas seguintes disposições legais:</span> <span data-source-label="18">[Artigo 232 do Código Penal...] P: Qual é a pena para homicídio doloso?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="441" width="952" height="149" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="457" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Resposta Gerada</span></div></foreignObject>
        <foreignObject x="48" y="499" width="904" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="20">De acordo com o Artigo 232 do Código Penal, o homicídio doloso é punível com morte, prisão perpétua, ou pena de prisão de duração determinada não inferior a 10 anos;</span> <span data-source-label="21">se as circunstâncias forem leves, a pena é de prisão de duração determinada não inferior a 3 anos e não superior a 10 anos.</span></div></foreignObject>
      </g></svg>