<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" role="img" aria-labelledby="title" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
    <title id="title">Fase 1: Formatação SFT · Fase 2: Estratégia de Modelagem por RL</title>
    <defs>
  <marker id="training-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 4, 0 8" fill="#203047"/></marker>
</defs>
    <rect x="20" y="20" width="440" height="430" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="44" y="35" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="0" style="width:100%">Fase 1: Formatação SFT</div></div>
  </foreignObject>
    <foreignObject x="44" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="1" style="width:100%">Objetivo: Saída analisável (JSON/chamada de ferramenta)</div></div>
  </foreignObject><foreignObject x="44" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="2" style="width:100%">Dados: Milhares de demonstrações de alta qualidade</div></div>
  </foreignObject><foreignObject x="44" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="3" style="width:100%">Condição de parada: Formato estável, capacidade básica alcançada</div></div>
  </foreignObject><foreignObject x="44" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="4" style="width:100%">⚠ Sobretreinamento → Modelo colapsa para a distribuição de treinamento</div></div>
  </foreignObject>
    <rect x="660" y="20" width="440" height="430" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="684" y="35" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="7" style="width:100%">Fase 2: Estratégia de Modelagem por RL</div></div>
  </foreignObject>
    <foreignObject x="684" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="8" style="width:100%">Objetivo: Maximizar a recompensa da tarefa (precisão/taxa de sucesso)</div></div>
  </foreignObject><foreignObject x="684" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="9" style="width:100%">Pré-requisito: Formato de saída estável → Recompensa computável</div></div>
  </foreignObject><foreignObject x="684" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="10" style="width:100%">Avanço: Descobrir novas estratégias além das demonstrações do SFT</div></div>
  </foreignObject><foreignObject x="684" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="11" style="width:100%">✓ Formato estável + Generalização de estratégia = Pronto para implantação</div></div>
  </foreignObject>
    <foreignObject x="480" y="154" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="5" style="width:100%">Formato</div></div>
  </foreignObject>
    <foreignObject x="480" y="224" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="6" style="width:100%">Estável</div></div>
  </foreignObject>
    <line x1="478" y1="320" x2="642" y2="320" stroke="#7386a0" stroke-width="2.5" marker-end="url(#training-arrow)"/>
    <rect x="20" y="480" width="1080" height="155" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="45" y="490" width="1030" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="12" style="width:100%">Por que não podemos pular o SFT e ir direto para o RL?</div></div>
  </foreignObject>
    <foreignObject x="50" y="550" width="1020" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="13" style="width:100%">A saída do modelo base é não estruturada → Não é possível analisar o JSON → A função de recompensa retorna NaN → Todos os gradientes são zero → O treinamento falha completamente</div></div>
  </foreignObject>
    <foreignObject x="40" y="655" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="14" style="width:100%">SFT memoriza a distribuição → RL generaliza a estratégia</div></div>
  </foreignObject>
    <foreignObject x="40" y="720" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:19px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="15" style="width:100%">SFT: max Σ log P(y|x) (ajustar a distribuição de treinamento) RL: max E[R(τ)] (otimizar o objetivo da tarefa)</div></div>
  </foreignObject>
    <foreignObject x="40" y="795" width="1040" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="16" style="width:100%">Quando "não importa quantas demonstrações sejam adicionadas, novos cenários ainda têm desempenho ruim" → Ponto de virada para mudar para RL</div></div>
  </foreignObject>
  </svg>