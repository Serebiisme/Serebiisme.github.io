<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="15.5" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. markitdown extrai o texto → 2. Descompactar o PPTX para acessar o XML</text>
