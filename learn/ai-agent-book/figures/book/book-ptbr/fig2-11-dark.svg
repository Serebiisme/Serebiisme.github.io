<text x="637.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">thumbnail.py etc.</text>
