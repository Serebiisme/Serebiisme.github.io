<svg data-layout="voice-architecture" data-figure="6-10" xmlns="http://www.w3.org/2000/svg" width="1000" height="1303" viewBox="0 0 1000 1303" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><g data-node="user-input"><rect x="250" y="24" width="500" height="113" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="270" y="44" width="460" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">Entrada do usuário</span></div></foreignObject><foreignObject x="270" y="89" width="460" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">&quot;Qual plano escolher?&quot;</span></div></foreignObject></g><g data-node="parallel-thinking"><rect x="80" y="201" width="840" height="253" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="104" y="221" width="792" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:left;overflow-wrap:anywhere"><span data-source-label="2">Pensamento paralelo</span></div></foreignObject><g data-thought-path="fast-thinking"><rect x="104" y="272" width="384" height="162" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="124" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Pensamento rápido ~500ms (thinking desativado)</span></div></foreignObject><foreignObject x="124" y="363" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">&quot;Bom preço, recomendo a compra&quot;</span></div></foreignObject></g><g data-thought-path="slow-thinking"><rect x="512" y="272" width="384" height="162" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="292" width="344" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Pensamento lento ~8s (thinking ativado)</span></div></foreignObject><foreignObject x="532" y="363" width="344" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">&quot;Não possui roaming internacional, não é adequado&quot;</span></div></foreignObject></g></g><path data-edge="input-to-parallel-thinking" data-from="user-input" data-to="parallel-thinking" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="64" d="M500 145 L500 193" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-node="user-experience"><rect x="200" y="542" width="600" height="223" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="220" y="562" width="560" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">Experiência do usuário</span></div></foreignObject><foreignObject x="220" y="609" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">0.5s: &quot;Bom preço, recomendo a compra&quot;</span></div></foreignObject><foreignObject x="220" y="645" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">8.0s: &quot;Não possui roaming internacional, não é adequado&quot;</span></div></foreignObject><foreignObject x="220" y="681" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">→ Contradição!</span></div></foreignObject><foreignObject x="220" y="717" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">→ Usuário perde a confiança</span></div></foreignObject></g><path data-edge="fast-thinking-to-experience" data-from="fast-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M296 442 V494 H400 V534" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><path data-edge="slow-thinking-to-experience" data-from="slow-thinking" data-to="user-experience" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="88" d="M704 442 V494 H600 V534" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="48" y="805" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Dois problemas principais</span></div></foreignObject><g data-issue="overthinking"><rect x="24" y="856" width="464" height="162" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="876" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Problema 1: Pensar demais em problemas simples</span></div></foreignObject><foreignObject x="44" y="947" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">&quot;Que dia é hoje?&quot; → Pensamento rápido já está correto → Pensamento lento ainda executa por 8s</span></div></foreignObject></g><g data-issue="inconsistency"><rect x="512" y="856" width="464" height="162" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="876" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Problema 2: Inconsistência entre rápido e lento</span></div></foreignObject><foreignObject x="532" y="921" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Caminhos de pensamento independentes, as suposições podem ser completamente diferentes</span></div></foreignObject></g><g data-conclusion="advisor-improvement"><rect x="24" y="1058" width="464" height="221" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="1078" width="424" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">Melhoria: Pensamento lento como &quot;conselheiro&quot; orientando nos bastidores</span></div></foreignObject><foreignObject x="44" y="1149" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">Pensamento lento → Barra de status do Agente → Pensamento rápido</span></div></foreignObject><foreignObject x="44" y="1208" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">Sem conflito direto, mas a comunicação é indiretamente vaga</span></div></foreignObject></g><g data-conclusion="fundamental-limitations"><rect x="512" y="1058" width="464" height="221" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="532" y="1078" width="424" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">Ainda apresenta limitações fundamentais</span></div></foreignObject><foreignObject x="532" y="1123" width="424" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">O pensamento rápido pode interpretar mal as dicas da barra de status (&quot;Confirmar preço&quot; →</span> <span data-source-label="22">&quot;Confirmar com o usuário&quot; em vez de &quot;Recalcular&quot;)</span></div></foreignObject><foreignObject x="532" y="1205" width="424" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="23">Não consegue alcançar a interação natural de &quot;pensar enquanto fala&quot;</span></div></foreignObject></g></svg>