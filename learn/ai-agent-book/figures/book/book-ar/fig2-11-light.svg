<text x="529.937" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطبقة 1: البيانات الوصفية (يتم تحميلها عند بدء التشغيل، ~300 رمز مميز)</text>
