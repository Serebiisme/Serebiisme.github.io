<rect x="60" y="280" width="700" height="100" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="271.6" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التدفق الأساسي لمهارة PPTX:</text>
<text x="607.6" y="322" font-family="'Courier New', Courier, monospace" font-size="6" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">1. قم باستخراج النص → 2. قم بفك ضغط PPTX للوصول إلى XML</text>
