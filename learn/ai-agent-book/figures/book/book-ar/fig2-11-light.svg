<text x="607.6" y="366" font-family="'Courier New', Courier, monospace" font-size="6" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المراجع: → html2pptx.md | → مرجع.MD | → البرامج النصية/</text>
