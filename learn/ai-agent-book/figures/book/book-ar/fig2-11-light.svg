<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 625" width="820" height="625" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
