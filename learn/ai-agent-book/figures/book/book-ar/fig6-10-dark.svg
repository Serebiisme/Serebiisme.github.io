-arrow)"/><g data-node="user-experience"><rect x="200" y="542" width="600" height="223" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="220" y="562" width="560" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">تجربة المستخدم</span></div></foreignObject><foreignObject x="220" y="609" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">0.5 ثانية: "سعر جيد، أوصي بالشراء"</span></div></foreignObject><foreignObject x="220" y="645" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">8.0s: "يفتقر إلى التجوال الدولي، غير مناسب"</span></div></foreignObject><foreignObject x="220" y="681" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">→ تناقض!</span></div></foreignObject><foreignObject x="220" y="717" width="560" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">→ المستخدم يفقد الثقة</span></div></foreignObj