      <g data-example="generated-answer">
        <rect x="24" y="470" width="952" height="149" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="486" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">الاستجابة المولدة</span></div></foreignObject>
        <foreignObject x="48" y="528" width="904" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">ووفقاً للمادة 232 من القانون الجنائي، يعاقب على جريمة القتل العمد بالإعدام، أو السجن المؤبد، أو السجن لمدة محددة لا تقل عن عشر سنوات؛</span> <span data-source-label="20">وإذا كانت الظروف بسيطة، تكون العقوبة السجن لمدة محددة لا تقل عن ثلاث سنوات ولا تزيد على عشر سنوات.</span></div></foreignObject>
