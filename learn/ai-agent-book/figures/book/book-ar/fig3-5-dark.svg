        <foreignObject x="540" y="358" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">أجب عن السؤال استنادا إلى الأحكام القانونية التالية:</span> <span data-source-label="17">[المادة 232 من قانون العقوبات...] س: ما عقوبة القتل العمد؟</span></div></foreignObject>
