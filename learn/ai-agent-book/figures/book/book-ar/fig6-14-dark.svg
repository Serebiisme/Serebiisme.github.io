pan data-source-label="10">بناءً على الصورة التي تم تصغير حجمها</span></div></foreignObject><foreignObject x="180" y="702" width="640" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">التنبؤ: (683، 384)</span></div></foreignObject><foreignObject x="180" y="745" width="640" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">→ الرجوع إلى الدقة الفعلية</span></div></foreignObject></g><g data-panel="full-workflow"><rect x="24" y="817" width="952" height="159" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="837" width="912" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">سير العمل الكامل</span></div></foreignObject><foreignObject x="44" y="882" width="912" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">① حدد دقة الهدف حسب نسبة العرض إلى الارتفاع → ② لقطة شاشة ذات نطاق منخفض باستخدام ImageMagick → ③ ينشئ استنتاج النموذج إحداثيات → ④ زيادة الحجم بشكل متناسب → ⑤ نفذ باستخدام xdotool</span></div></foreignObject></g><g data-panel="scaling-example"><rect x="24" y="1000" width="952" height="134" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5