<svg xml:lang="hu" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 625" width="820" height="625" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7386a0"/></marker></defs>

<rect x="40" y="70" width="740" height="90" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
<text x="60" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">1. réteg: metaadatok (indításkor betöltve, ~300 token)</text>
<rect x="60" y="108" width="700" height="48" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="130" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">skills: [{name: "PPTX", desc: "Create PowerPoint presentations from content"}</text>
<text x="70" y="145" font-family="'Courier New', Courier, monospace" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">{name: "PDF",  desc: "Extract and analyze PDF documents"}, ...]</text>
<line x1="100" y1="168" x2="100" y2="232" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<foreignObject data-connector-caption="true" x="124" y="176" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#52627a;text-align:start;overflow-wrap:anywhere">Feladatindító: „PPT készítése tanulmányból”</div></foreignObject>
<rect x="40" y="240" width="740" height="150" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="60" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">2. réteg: a SKILL.md alapfolyamata (igény szerint betöltve, ~2K token)</text>
<rect x="60" y="280" width="700" height="100" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="70" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">A PPTX-készség alapfolyamata:</text>
<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="14.5" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. szövegkinyerés a markitdownnal → 2. a PPTX kicsomagolása az XML eléréséhez</text>
<text x="70" y="344" font-family="'Courier New', Courier, monospace" font-size="15" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">3. a slide{N}.xml tartalmának módosítása → 4. visszacsomagolás .pptx fájlba</text>
<text x="70" y="366" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">Hivatkozások: → html2pptx.md | → reference.md | → scripts/</text>
<line x1="100" y1="398" x2="100" y2="462" stroke="#7386a0" stroke-width="2" marker-end="url(#ah)"/>
<foreignObject data-connector-caption="true" x="124" y="406" width="630" height="48"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;color:#52627a;text-align:start;overflow-wrap:anywhere">Részletes módszer szükséges: „PPT készítése HTML-sablonnal”</div></foreignObject>
<rect x="40" y="470" width="740" height="140" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2" stroke-dasharray="8,4"/>
<text x="60" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="bold">3. réteg: aldokumentumok (célzott részletek, igény szerint betöltve)</text>
<rect x="60" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="167.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">html2pptx.md</text>
<text x="167.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Teljes munkafolyamat:</text>
<text x="167.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">HTML-sablon → PPT</text>
<rect x="295" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="402.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">reference.md</text>
<text x="402.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">XML-formátum specifikációja</text>
<text x="402.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">és műszaki részletek</text>
<rect x="530" y="515" width="215" height="80" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="637.5" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="bold">scripts/*.py</text>
<text x="637.5" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Futtatható eszközök:</text>
<text x="637.5" y="573" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">thumbnail.py stb.</text>
<rect x="100" y="620" width="620" height="35" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="2"/>
<text x="410" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">Rögzített metaadatok → KV-gyorsítótár-barát | Dinamikus tartalom hozzáfűzve → a gyorsítótár érvényben marad</text>
</svg>
