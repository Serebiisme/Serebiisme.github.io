        <rect x="516" y="277" width="460" height="170" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="540" y="293" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Kiegészített prompt</span></div></foreignObject>
        <foreignObject x="540" y="335" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">Válaszoljon a kérdésre az alábbi jogszabályok alapján:</span> <span data-source-label="17">[Article 232 of the Criminal Law...] Q: What is the sentence for intentional homicide?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="463" width="952" height="170" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="479" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">generált válasz</span></div></foreignObject>
        <foreignObject x="48" y="521" width="904" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">According to Article 232 of the Criminal Law, the crime of intentional homicide is punishable by death, life imprisonment, or fixed-term imprisonment of not less than ten years;</span> <span data-source-label="20">if the circumstances are minor, the sentence is fixed-term imprisonment of not less than three years but not more than ten years.</span></div></foreignObject>
