        <foreignObject x="48" y="293" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">Retrieved szöveg chunks</span></div></foreignObject>
        <foreignObject x="48" y="335" width="412" height="86"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="13">Article 232 of the Criminal Law: Whoever intentionally kills another shall be sentenced to death,</span> <span data-source-label="14">life imprisonment or fixed-term imprisonment of not less than ten years...</span></div></foreignObject>
