      <foreignObject x="32" y="409" width="936" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#52627a;text-align:start;overflow-wrap:anywhere"><span data-source-label="15">· Lý luận nhiều bước: "Địa chỉ của bệnh viện nơi nha sĩ của tôi tọa lạc" = người dùng → Bác sĩ Zhang-A → Bệnh viện Nha khoa Renai → địa chỉ, đi qua mối quan hệ từng bước dọc theo cạnh mối quan hệ</span> <span data-source-label="16">· Định hướng thực thể: Hai "Dr. Zhang" có cùng tên là các nút khác nhau trong biểu đồ và được phân biệt bằng các cạnh mối quan hệ tương ứng của chúng (nha khoa/tim mạch). Mỗi cạnh = một bộ ba (chủ thể-quan hệ-đối tượng)</span></div></foreignObject>
