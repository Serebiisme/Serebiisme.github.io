<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="589" viewBox="0 0 1000 589" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><rect x="24" y="24" width="440" height="318" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><rect x="536" y="24" width="440" height="318" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="44" width="400" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">Phân đoạn truyền thống (không có context)</span></div></foreignObject><foreignObject x="556" y="44" width="400" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">Phân đoạn nhận biết context</span></div></foreignObject><rect x="556" y="83" width="400" height="77" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="572" y="99" width="368" height="45"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">[Công ty ACME 2025 Năm Q2 Báo cáo tài chính·Các chỉ số hiệu suất chính]</span></div></foreignObject><rect x="44" y="83" width="400" height="83" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="60" y="99" width="368" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="1">Doanh thu quý hai của công ty tăng 3%,</span> <span data-source-label="2">Chủ yếu được thúc đẩy bởi các dòng sản phẩm mới.</span></div></foreignObject><rect x="556" y="172" width="400" height="83" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="572" y="188" width="368" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="7">Doanh thu quý hai của công ty tăng 3%,</span> <span data-source-label="8">Chủ yếu được thúc đẩy bởi các dòng sản phẩm mới.</span></div></foreignObject><foreignObject x="44" y="182" width="400" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">Câu hỏi: "Công ty" là ai? Năm nào?</span></div></foreignObject><foreignObject x="44" y="222" width="400" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">→ So khớp dữ liệu doanh thu của một số lượng lớn các công ty không liên quan khi truy xuất</span></div></foreignObject><foreignObject x="556" y="271" width="400" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">→ Kết hợp chính xác ACME + Q2 + tăng trưởng doanh thu</span></div></foreignObject><path d="M472 124.5 H500 V213.5 H528" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="36" y="374" width="928" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">Giai đoạn lập chỉ mục: LLM tạo tiền tố context</span></div></foreignObject><rect x="36" y="427" width="202" height="89" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="52" y="456" width="170" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">tài liệu gốc</span></div></foreignObject><path d="M246 471.5 L270 471.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="278" y="427" width="202" height="89" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="294" y="456" width="170" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Cắt nhỏ</span></div></foreignObject><path d="M488 471.5 L512 471.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="520" y="427" width="202"