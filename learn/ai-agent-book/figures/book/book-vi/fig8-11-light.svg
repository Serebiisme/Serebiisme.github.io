    <rect x="20" y="480" width="1080" height="155" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="45" y="490" width="1030" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="12" style="width:100%">Tại sao chúng ta không thể bỏ qua SFT và truy cập trực tiếp vào RL?</div></div>
  </foreignObject>
    <foreignObject x="50" y="550" width="1020" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="13" style="width:100%">Đầu ra mô hình cơ bản không có cấu trúc → không thể phân tích cú pháp JSON → hàm phần thưởng trả về NaN → độ dốc hoàn toàn bằng 0 → quá trình đào tạo thất bại hoàn toàn</div></div>
  </foreignObject>
    <foreignObject x="40" y="655" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="14" style="width:100%">Phân phối bộ nhớ SFT → Chiến lược tổng quát hóa RL</div></div>
  </foreignObject>
    <foreignObject x="40" y="720" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:19px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="15" style="width:100%">SFT: max Σ log P(y|x) (phân phối đào tạo được trang bị) RL: max E[R(τ)] (mục tiêu nhiệm vụ tối ưu hóa)</div></div>
  </foreignObject>
    <foreignObject x="40" y="795" width="1040" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="16" style="width:100%">Khi "dù có trình diễn bao nhiêu đi nữa thì cảnh mới vẫn không hay" → chuyển sang điểm mấu chốt của RL</div></div>
  </foreignObject>
  </svg>