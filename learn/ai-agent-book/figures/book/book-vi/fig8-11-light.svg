    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="1" style="width:100%">Mục tiêu: đầu ra có thể phân tích cú pháp (JSON/gọi tool)</div></div>
  </foreignObject><foreignObject x="44" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="2" style="width:100%">Dữ liệu: Hàng ngàn cuộc biểu tình chất lượng cao</div></div>
  </foreignObject><foreignObject x="44" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="3" style="width:100%">Điều kiện dừng: Định dạng ổn định và khả năng bắt đầu hình thành.</div></div>
  </foreignObject><foreignObject x="44" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="4" style="width:100%">⚠ Overtraining → Mô hình sụp đổ để phân phối đào tạo</div></div>
  </foreignObject>
    <rect x="660" y="20" width="440" height="430" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="684" y="35" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="7" style="width:100%">Giai đoạn 2: Chiến lược định hình RL</div></div>
  </foreignObject>
    <foreignObject x="684" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="8" style="width:100%">Mục tiêu: Tối đa hóa phần thưởng nhiệm vụ (tỷ lệ chính xác/tỷ lệ thành công)</div></div>
  </foreignObject><foreignObject x="684" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="9" style="width:100%">Điều kiện tiên quyết: Định dạng đầu ra ổn định → có thể tính toán phần thưởng</div></div>
  </foreignObject><foreignObject x="684" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="10" style="width:100%">Đột phá: Khám phá các chiến lược mới ngoài phần trình diễn SFT</div></div>
  </foreignObject><foreignObject x="684" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="11" style="width:100%">✓ Định dạng ổn định + khái quát hóa chính sách = sẵn sàng triển khai</div></div>
  </foreignObject>
    <foreignObject x="480" y="154" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="5" style="width:100%">Định dạng</div></div>
  </foreignObject>
    <foreignObject x="480" y="224" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="6" style="width:100%">Ổn định</div></div>
  </foreignObject>
