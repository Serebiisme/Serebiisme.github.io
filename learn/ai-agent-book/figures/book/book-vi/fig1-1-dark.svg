  <title id="title">Vòng lặp tương tác Agent–Môi trường</title>
  <desc id="desc">Agent gồm một Mô hình được bao quanh bởi Harness. Môi trường trả về quan sát cho Agent, còn Agent gửi hành động đến Môi trường; Harness trung gian cho tương tác nhưng không phải là Môi trường.</desc>
