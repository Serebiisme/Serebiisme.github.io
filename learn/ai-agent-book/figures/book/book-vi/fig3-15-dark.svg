="12">Vector hóa tính năng</span></div></foreignObject><foreignObject x="60" y="562" width="240" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">Mã hóa một nóng + mã hóa đa nóng</span> <span data-source-label="14">+ phép biến đổi logarit + chuẩn hóa</span></div></foreignObject><path d="M324 566.5 L356 566.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="364" y="481" width="272" height="171" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="380" y="497" width="240" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Phân cụm KMeans</span></div></foreignObject><foreignObject x="380" y="562" width="240" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">Khám phá "Nguyên mẫu của vụ án"</span> <span data-source-label="17">Ví dụ: "ẩu đả tay không, thương tích nhẹ"</span></div></foreignObject><path d="M644 566.5 L676 566.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="684" y="481" width="272" height="171" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="700" y="497" width="240" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf