      </g>
      <g data-example="augmented-prompt">
        <rect x="516" y="277" width="460" height="154" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="293" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">Prompt nâng cao</span></div></foreignObject>
        <foreignObject x="540" y="335" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">Trả lời các câu hỏi dựa vào quy luật sau:</span> <span data-source-label="17">[Điều 232 Bộ luật Hình sự...] Hỏi: Tội cố ý giết người bị phạt bao lâu?</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="447" width="952" height="149" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="463" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">câu trả lời được tạo ra</span></div></foreignObject>
        <foreignObject x="48" y="505" width="904" height="65"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">Theo Điều 232 của Bộ luật Hình sự, tội cố ý giết người có thể bị phạt tử hình, tù chung thân hoặc phạt tù có thời hạn trên mười năm;</span> <span data-source-label="20">Nếu tình tiết tương đối nhẹ thì bị phạt tù có thời hạn từ ba năm đến mười năm.</span></div></foreignObject>
      </g></svg>