  <foreignObject data-label="16" x="818" y="379" width="142" height="52">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">ngữ cảnh</div></div>
