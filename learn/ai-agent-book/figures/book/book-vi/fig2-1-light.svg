  <foreignObject data-label="12" x="42" y="552" width="694" height="48">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Courier New',monospace;font-size:15px;font-weight:400;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">có thể tóm tắt và trả lời mà không cần gọi lại tool.&lt;/think&gt;</div></div>
  </foreignObject><rect x="24" y="618" width="730" height="120" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/>
      
  <foreignObject data-label="13" x="42" y="624" width="694" height="36">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">Vị trí sinh hiện tại →</div></div>
  </foreignObject>
      
  <foreignObject data-label="14" x="42" y="660" width="694" height="72">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Courier New',monospace;font-size:15px;font-weight:400;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">assistant: "Bắc Kinh hôm nay trời quang, 23°C…" ← LLM đang sinh</div></div>
