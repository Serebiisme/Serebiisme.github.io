<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 870" width="980" height="870" role="img" aria-labelledby="title" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
  <title id="title">Cửa sổ ngữ cảnh</title>
  <rect x="24" y="24" width="730" height="132" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/>
      
  <foreignObject data-label="0" x="42" y="30" width="694" height="36">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">Từ nhắc hệ thống (System Prompt)</div></div>
  </foreignObject>
      
  <foreignObject data-label="1" x="42" y="66" width="694" height="42">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Courier New',monospace;font-size:15px;font-weight:400;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">"You are a helpful assistant. You MUST answer concisely."</div></div>
  </foreignObject>
