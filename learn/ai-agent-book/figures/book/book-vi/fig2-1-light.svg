  </foreignObject>
      
  <foreignObject data-label="11" x="42" y="504" width="694" height="48">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Courier New',monospace;font-size:15px;font-weight:400;line-height:1.35;color:#203047;overflow-wrap:anywhere;white-space:pre-wrap"><div dir="auto">&lt;think&gt;Người dùng hỏi về thời tiết và tôi đã có kết quả từ tool,</div></div>
