<text x="70" y="300" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">PPTX Skill Quy trình cốt lõi:</text>
<text x="70" y="322" font-family="'Courier New', Courier, monospace" font-size="16" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central">1. markitdown Trích xuất văn bản → 2. Giải nén PPTX Truy cập XML</text>
