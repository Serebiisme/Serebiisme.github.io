<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 940 300" width="940" height="300" style="background:#ffffff"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7386a0"/></marker></defs>
<rect x="30" y="66" width="380" height="210" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2" />
