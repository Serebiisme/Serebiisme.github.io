<text x="70" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">"Hello, who are you?"</text>
