<text x="570" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">Phản hồi do mô hình tạo</text>
<text x="570" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="start" dominant-baseline="central" font-weight="normal">"Hi! I'm a coding assistant…"</text>
<text x="470" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal"><tspan x="450" dy="-8.26">Mỗi cuộc gọi là không trạng thái - tất cả thông tin mà mô hình yêu cầu phải được cung cấp đầy đủ trong danh sách</tspan><tspan x="450" dy="16.52">messages được yêu cầu</tspan></text>
