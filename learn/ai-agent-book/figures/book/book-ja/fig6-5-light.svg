<svg data-layout="async-architecture" data-figure="6-5" xmlns="http://www.w3.org/2000/svg" width="1000" height="838" viewBox="0 0 1000 838" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><rect x="24" y="24" width="952" height="226" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="48" y="48" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">互換方式：ランタイムが非同期の進行を調整</span></div></foreignObject><g data-flow="compatibility" data-stage="1"><rect x="48" y="101" width="272" height="125" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="64" y="117" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">タスクはバックグラウンドで実行</span></div></foreignObject><foreignObject x="64" y="182" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">「未完了」を明示して記録</span></div></foreignObject></g><path data-edge="compatibility-1-to-2" data-from="compatibility-1" data-to="compatibility-2" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M328 163.5 H356" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="compatibility" data-stage="2"><rect x="364" y="101" width="272" height="125" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="117" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">ランタイムが新しいイベントを受信</span></div></foreignObject><foreignObject x="380" y="182" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">キュー・割り込み・並列を選択</span></div></foreignObject></g><path data-edge="compatibility-2-to-3" data-from="compatibility-2" data-to="compatibility-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 163.5 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="compatibility" data-stage="3"><rect x="680" y="101" width="272" height="125" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="117" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">モデルがタスクを続ける</span></div></foreignObject><foreignObject x="696" y="156" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">入力は同期的な対話形式</span></div></foreignObject></g><rect x="24" y="306" width="952" height="353" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5" stroke-dasharray="6 5"/><foreignObject x="48" y="330" width="904" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="7">ネイティブな非同期：待機と途中の変化をモデルが理解</span></div></foreignObject><g data-flow="work-while-waiting" data-stage="1"><rect x="48" y="383" width="272" height="125" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="64" y="399" width="240" height="57"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">時間のかかる問い合わせを開始</span></div></foreignObject><foreignObject x="64" y="464" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">例：会議会場を探す</span></div></foreignObject></g><path data-edge="work-while-waiting-1-to-2" data-from="work-while-waiting-1" data-to="work-while-waiting-2" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M328 445.5 H356" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="work-while-waiting" data-stage="2"><rect x="364" y="383" width="272" height="125" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="399" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">待機中も作業を続ける</span></div></foreignObject><foreignObject x="380" y="438" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">例：議題と準備リストを作る</span></div></foreignObject></g><path data-edge="work-while-waiting-2-to-3" data-from="work-while-waiting-2" data-to="work-while-waiting-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 445.5 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="work-while-waiting" data-stage="3"><rect x="680" y="383" width="272" height="125" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="399" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">結果が届いてから判断</span></div></foreignObject><foreignObject x="696" y="438" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">実際の情報で会場を比較</span></div></foreignObject></g><g data-flow="mid-task-update" data-stage="1"><rect x="48" y="536" width="272" height="99" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="64" y="552" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">ユーザーが途中で要求を追加</span></div></foreignObject><foreignObject x="64" y="591" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">例：予算や人数の変更</span></div></foreignObject></g><path data-edge="mid-task-update-1-to-2" data-from="mid-task-update-1" data-to="mid-task-update-2" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M328 585.5 H356" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="mid-task-update" data-stage="2"><rect x="364" y="536" width="272" height="99" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="552" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">完了済みの作業を保持</span></div></foreignObject><foreignObject x="380" y="591" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">新しい要求をタスクに反映</span></div></foreignObject></g><path data-edge="mid-task-update-2-to-3" data-from="mid-task-update-2" data-to="mid-task-update-3" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="44" d="M644 585.5 H672" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-flow="mid-task-update" data-stage="3"><rect x="680" y="536" width="272" height="99" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="696" y="552" width="240" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">その後の行動を調整</span></div></foreignObject><foreignObject x="696" y="591" width="240" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">既存情報とすべての更新を統合</span></div></foreignObject></g><rect x="24" y="699" width="952" height="115" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="48" y="723" width="904" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">モデルは変化を理解して計画を調整。ランタイムは実行・状態・イベントの出所を管理。</span></div></foreignObject><foreignObject x="48" y="762" width="904" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">メッセージの受信に加え、正しいタスク再開と実際の動作の制御が必要。</span></div></foreignObject></svg>