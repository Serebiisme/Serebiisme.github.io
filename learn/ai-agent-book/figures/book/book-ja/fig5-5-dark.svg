idth="304" height="230" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="368" y="637" width="264" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="31">分離の利点</span></div></foreignObject><foreignObject x="368" y="684" width="264" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="32">Reviewer の独立したコンテキスト → スクリーンショット＋コードのみ</span></div></foreignObject><foreignObject x="368" y="745" width="264" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="33">Proposer はコードに集中 → 修正提案のみを受け取る</span></div></foreignObject></g><g data-benefit="actual-effect"><rect x="672" y="617" width="304" height="230" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="692" y="637" width="264" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="34">実際の効果</span></div></foreignObject><foreignObject x="692" y="684" width="264" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="35">コンテキスト使用量を大幅に削減</span></div></foreignObject><foreignObject x="692" y="722" width="264" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="36">修正精度が大幅に向上</span></div></foreignObject></g></svg>