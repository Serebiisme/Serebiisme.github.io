<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><rect x="24" y="24" width="440" height="292" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><rect x="536" y="24" width="440" height="292" rx="8" fill="#1e2836" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="44" y="44" width="400" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">従来のチャンク分割（コンテキストなし）</span></div></foreignObject><foreignObject x="556" y="44" width="400" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">コンテキスト対応のチャンク分割</span></div></foreignObject><rect x="556" y="83" width="400" height="57" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="572" y="99" width="368" height="25"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">[ACME 社 2025年 Q2 決算報告 ・ 主要業績指標]</span></div></foreignObject><rect x="44" y="83" width="400" height="83" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="60" y="99" width="368" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="1">同社の第2四半期の売上は3%増加し、</span><span data-source-label="2">主に新製品ラインが牽引した。</span></div></foreignObject><rect x="556" y="152" width="400" height="83" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="572" y="168" width="368" height="51"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="7">同社の第2四半期の売上は3%増加し、</span><span data-source-label="8">主に新製品ラインが牽引した。</span></div></foreignObject><foreignObject x="44" y="182" width="400" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">疑問：「同社」とはどこの会社？どの年？</span></div></foreignObject><foreignObject x="44" y="222" width="400" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">→ 検索が無関係な多数の企業の売上データに一致してしまう</span></div></foreignObject><foreignObject x="556" y="251" width="400" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">→ ACME + Q2 + 売上成長 に正確に一致</span></div></foreignObject><path d="M472 124.5 H500 V193.5 H528" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><foreignObject x="36" y="348" width="928" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">インデックス化の段階：LLM がコンテキストのプレフィックスを生成</span></div></foreignObject><rect x="36" y="401" width="202" height="167" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="52" y="469" width="170" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">元の文書</span></div></foreignObject><path d="M246 484.5 L270 484.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="278" y="401" width="202" height="167" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="294" y="469" width="170" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">チャンク分割</span></div></foreignObject><path d="M488 484.5 L512 484.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="520" y="401" width="202" height="167" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="536" y="417" width="170" height="135"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="14">LLM がプレフィックスを生</span><span data-source-label="15">成</span> <span data-source-label="16">（プロンプトキャッシュ）</span></div></foreignObject><path d="M730 484.5 L754 484.5" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="762" y="401" width="202" height="167" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="778" y="443" width="170" height="83"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">プレフィックス＋元のテ</span><span data-source-label="18">キスト</span> <span data-source-label="19">→ インデックス</span></div></foreignObject><foreignObject x="36" y="592" width="928" height="25"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="20">効果：検索失敗率 ↓49%（+BM25）、↓67%（+リランキング）— Anthropic のデータ</span></div></foreignObject></svg>