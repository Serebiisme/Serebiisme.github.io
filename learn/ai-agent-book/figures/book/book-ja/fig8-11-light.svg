  </foreignObject>
    <foreignObject x="44" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="1" style="width:100%">目標: 出力を解析可能に（JSON／ツール呼び出し）</div></div>
  </foreignObject><foreignObject x="44" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="2" style="width:100%">データ: 数千件の高品質な実演</div></div>
  </foreignObject><foreignObject x="44" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="3" style="width:100%">停止条件: 形式が安定し、基本能力を獲得</div></div>
  </foreignObject><foreignObject x="44" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="4" style="width:100%">⚠ 過学習 → モデルが学習分布に崩壊</div></div>
  </foreignObject>
    <rect x="660" y="20" width="440" height="430" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="684" y="35" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="7" style="width:100%">フェーズ2: RL による方策の形成</div></div>
  </foreignObject>
    <foreignObject x="684" y="120" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="8" style="width:100%">目標: タスク報酬を最大化（正確率／成功率）</div></div>
  </foreignObject><foreignObject x="684" y="198" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="9" style="width:100%">前提: 出力形式が安定 → 報酬が計算可能</div></div>
  </foreignObject><foreignObject x="684" y="276" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="10" style="width:100%">突破: SFT の実演を超える新しい方策を発見</div></div>
  </foreignObject><foreignObject x="684" y="354" width="392" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;font-weight:400;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="11" style="width:100%">✓ 安定した形式 + 方策の汎化 = デプロイ可能</div></div>
  </foreignObject>
    <foreignObject x="480" y="154" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="5" style="width:100%">形式</div></div>
  </foreignObject>
    <foreignObject x="480" y="224" width="160" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="6" style="width:100%">安定</div></div>
  </foreignObject>
    <line x1="478" y1="320" x2="642" y2="320" stroke="#7386a0" stroke-width="2.5" marker-end="url(#training-arrow)"/>
    <rect x="20" y="480" width="1080" height="155" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="2"/>
    <foreignObject x="45" y="490" width="1030" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="12" style="width:100%">なぜ SFT を飛ばして直接 RL に進めないのか？</div></div>
  </foreignObject>
    <foreignObject x="50" y="550" width="1020" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="13" style="width:100%">ベースモデルの出力は非構造的 → JSON を解析できない → 報酬関数が NaN を返す → 勾配がすべてゼロ → 学習が完全に失敗</div></div>
  </foreignObject>
    <foreignObject x="40" y="655" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:23px;font-weight:700;line-height:1.28;color:#203047;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="14" style="width:100%">SFT は分布を記憶 → RL は方策を汎化</div></div>
  </foreignObject>
    <foreignObject x="40" y="720" width="1040" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:19px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="15" style="width:100%">SFT: max Σ log P(y|x)（学習分布に適合） RL: max E[R(τ)]（タスク目的を最適化）</div></div>
  </foreignObject>
    <foreignObject x="40" y="795" width="1040" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:18px;font-weight:400;line-height:1.28;color:#52627a;overflow-wrap:anywhere;word-break:normal;text-align:center"><div dir="auto" data-label="16" style="width:100%">「実演をいくら追加しても新しい状況で性能が上がらない」とき → RL に切り替える転換点</div></div>
  </foreignObject>
  </svg>