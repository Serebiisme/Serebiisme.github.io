<text x="410" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="var(--figure-ink)" text-anchor="middle" dominant-baseline="central" font-weight="normal">固定メタデータ → KV Cache に優しい | 動的コンテンツを追記 → キャッシュは無効化されない</text>
