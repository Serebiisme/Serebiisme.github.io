tica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">モジュール式データスキーマ</span></div></foreignObject><foreignObject x="60" y="317" width="880" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">コアスキーマ (voluntary_surrender/compensation/prior_convictions) + 罪種別の拡張スキーマ</span></div></foreignObject><foreignObject x="60" y="353" width="880" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="10">(theft→amount_involved, injury→injury_level)</span></div></foreignObject><rect x="24" y="441" width="952" height="373" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="461" width="912" height="41"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">フェーズ 2: 要素分析と知識モデリング</span></div></foreignObject><rect x="44" y="502" width="272" height="145" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="60" y="518" width="240" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">特徴のベクトル化</span></div></foreignObject><foreignObject x="60" y="557" width="240" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="13">One-hot エンコーディング + Multi-hot エンコーディング</span> <span data-source-label="14">+ 対数変換 + 標準化</span></div></foreignObject><path d="M324 574.5 L356 574.5" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="364" y="502" width="272" height="145" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="380" y="518" width="240" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">KMeans クラスタリング</span></div></foreignObject><foreignObject x="380" y="557" width="240" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">「ケースプロトタイプ」を発見</span><span data-source-label="17">例: 口論から素手の暴行で軽傷</span></div></foreignObject><path d="M644 574.5 L676 574.5" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="684" y="502" width="272" height="145" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="700" y="518" width="240" height="39"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">要素重要度モデル</span></div></foreignObject><foreignObject x="700" y="557" width="240" height="74"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="19">各要素の重みを定量化</span><span data-source-label="20">量刑判断のロジックを構築</span></div></foreignObject><path d="M820 655 L820 687" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/><rect x="44" y="695" width="912" height="99" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="60" y="711" width="880" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="21">応用: 対話型リーガルアドバイザリー Agent</span></div></foreignObject><foreignObject x="60" y="750" width="880" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="22">要素の重要度に沿って質問を誘導 → 類似のケースプロトタイプを検索 → データ駆動の量刑分析</span></div></foreignObject></svg>