<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" role="img"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e4ebf5"/></marker></defs><g data-stage="query">
        <rect x="24" y="24" width="202" height="126" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="40" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">① 使用者查詢</span></div></foreignObject>
        <foreignObject x="40" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">&quot;故意殺人罪判幾年？&quot;</span></div></foreignObject>
      </g><g data-stage="retrieval">
