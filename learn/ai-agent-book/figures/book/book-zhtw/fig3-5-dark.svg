        <foreignObject x="290" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">② 檢索 (Retrieval)</span></div></foreignObject>
        <foreignObject x="290" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">稠密檢索 + BM25</span> <span data-source-label="4">→ Top-K 文字塊</span></div></foreignObject>
      </g><g data-stage="augmentation">
        <rect x="524" y="24" width="202" height="126" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="540" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">③ 增強 (Augment)</span></div></foreignObject>
        <foreignObject x="540" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">查詢 + 檢索結果</span> <span data-source-label="7">→ 構造完整 Prompt</span></div></foreignObject>
      </g><g data-stage="generation">
        <rect x="774" y="24" width="202" height="126" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="790" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">④ 生成 (Generate)</span></div></foreignObject>
        <foreignObject x="790" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#b2bfd2;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">LLM 綜合上下文</span> <span data-source-label="10">→ 生成回答</span></div></foreignObject>
      </g>
      <g data-edge="query-to-retrieval" data-from="query" data-to="retrieval"><path d="M234 87 L266 87" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="retrieval-to-augmentation" data-from="retrieval" data-to="augmentation"><path d="M484 87 L516 87" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="augmentation-to-generation" data-from="augmentation" data-to="generation"><path d="M734 87 L766 87" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/></g>
      <foreignObject x="24" y="174" width="952" height="46"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">具體資料流示例</span></div></foreignObject>
      <g data-example="retrieved-text">
        <rect x="24" y="232" width="460" height="154" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="248" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">檢索到的文字塊</span></div></foreignObject>
        <foreignObject x="48" y="290" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="13">《刑法》第232條：故意殺人的，處死刑、</span><span data-source-label="14">無期徒刑或十年以上有期徒刑...</span></div></foreignObject>
      </g>
      <g data-example="augmented-prompt">
        <rect x="516" y="232" width="460" height="154" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="540" y="248" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">增強後的 Prompt</span></div></foreignObject>
        <foreignObject x="540" y="290" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">基於以下法條回答問題：</span> <span data-source-label="17">[《刑法》第232條...] 問：故意殺人罪判幾年？</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="402" width="952" height="146" rx="8" fill="#273449" stroke="#7c92af" stroke-width="1.5"/>
        <foreignObject x="48" y="418" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">生成的回答</span></div></foreignObject>
        <foreignObject x="48" y="460" width="904" height="62"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">根據《刑法》第232條，故意殺人罪處死刑、無期徒刑或十年以上有期徒刑；</span> <span data-source-label="20">情節較輕的，處三年以上十年以下有期徒刑。</span></div></foreignObject>
      </g></svg>