, 720)</span></div></foreignObject></g><g data-edge="screen-downscale"><path d="M500 228 L500 284" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><foreignObject x="560" y="243.5" width="260" height="25"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="13">縮小</span></div></foreignObject><g data-panel="resolution-1"><rect x="160" y="292" width="680" height="233" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="180" y="312" width="640" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">模型訓練解析度</span></div></foreignObject><foreignObject x="180" y="357" width="640" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">XGA: 1024×768</span></div></foreignObject><foreignObject x="180" y="397" width="640" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">WXGA: 1280×800</span></div></foreignObject><foreignObject x="180" y="437" width="640" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:c