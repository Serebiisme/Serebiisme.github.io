="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">預測: (683, 384)</span></div></foreignObject><foreignObject x="180" y="745" width="640" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">→ 放大回實際解析度</span></div></foreignObject></g><g data-panel="full-workflow"><rect x="24" y="817" width="952" height="113" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="837" width="912" height="33"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">完整流程</span></div></foreignObject><foreignObject x="44" y="882" width="912" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="16">①按寬高比選目標解析度 → ②ImageMagick縮小截圖 → ③模型推理生成座標 → ④按比例放大 → ⑤xdotool執行</span></div></foreignObject></g><g data-panel="scaling-example"><rect x="24" y="954" width="952" height="111" rx="8" fill="#ffffff" stroke="#7386a0" stroke-width="1.5"/><foreignObject x="44" y="974" width="912" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="17">縮放示例（16:9 螢幕 → FWXGA）</span></div></foreignObject><foreignObject x="44" y="1017" width="912" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">截圖: 2560×1440 → 1366×768 (×0.53) | 座標: 模型(683, 384) → 實際(1280, 720) (×1.87)</span></div></foreignObject></g></svg>