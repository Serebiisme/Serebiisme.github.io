<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" role="img"><style>svg{background:#f7f9fc!important;--figure-ink:#203047;--figure-inverse:#ffffff} body{background:#f7f9fc!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ch3-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203047"/></marker></defs><g data-stage="query">
        <rect x="24" y="24" width="202" height="126" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="40" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="0">① 用户查询</span></div></foreignObject>
        <foreignObject x="40" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="1">&quot;故意杀人罪判几年？&quot;</span></div></foreignObject>
      </g><g data-stage="retrieval">
        <rect x="274" y="24" width="202" height="126" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="290" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="2">② 检索 (Retrieval)</span></div></foreignObject>
        <foreignObject x="290" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">稠密检索 + BM25</span> <span data-source-label="4">→ Top-K 文本块</span></div></foreignObject>
      </g><g data-stage="augmentation">
        <rect x="524" y="24" width="202" height="126" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">③ 增强 (Augment)</span></div></foreignObject>
        <foreignObject x="540" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">查询 + 检索结果</span> <span data-source-label="7">→ 构造完整 Prompt</span></div></foreignObject>
      </g><g data-stage="generation">
        <rect x="774" y="24" width="202" height="126" rx="8" fill="#dce7f5" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="790" y="40" width="170" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="8">④ 生成 (Generate)</span></div></foreignObject>
        <foreignObject x="790" y="82" width="170" height="52"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#52627a;text-align:center;overflow-wrap:anywhere"><span data-source-label="9">LLM 综合上下文</span> <span data-source-label="10">→ 生成回答</span></div></foreignObject>
      </g>
      <g data-edge="query-to-retrieval" data-from="query" data-to="retrieval"><path d="M234 87 L266 87" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="retrieval-to-augmentation" data-from="retrieval" data-to="augmentation"><path d="M484 87 L516 87" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g><g data-edge="augmentation-to-generation" data-from="augmentation" data-to="generation"><path d="M734 87 L766 87" fill="none" stroke="#7386a0" stroke-width="2" marker-end="url(#ch3-arrow)"/></g>
      <foreignObject x="24" y="174" width="952" height="46"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="11">具体数据流示例</span></div></foreignObject>
      <g data-example="retrieved-text">
        <rect x="24" y="232" width="460" height="154" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="248" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="12">检索到的文本块</span></div></foreignObject>
        <foreignObject x="48" y="290" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="13">《刑法》第232条：故意杀人的，处死刑、</span><span data-source-label="14">无期徒刑或十年以上有期徒刑...</span></div></foreignObject>
      </g>
      <g data-example="augmented-prompt">
        <rect x="516" y="232" width="460" height="154" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="540" y="248" width="412" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="15">增强后的 Prompt</span></div></foreignObject>
        <foreignObject x="540" y="290" width="412" height="70"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="16">基于以下法条回答问题：</span> <span data-source-label="17">[《刑法》第232条...] 问：故意杀人罪判几年？</span></div></foreignObject>
      </g>
      <g data-example="generated-answer">
        <rect x="24" y="402" width="952" height="146" rx="8" fill="#edf2f8" stroke="#7386a0" stroke-width="1.5"/>
        <foreignObject x="48" y="418" width="904" height="42"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#203047;text-align:center;overflow-wrap:anywhere"><span data-source-label="18">生成的回答</span></div></foreignObject>
        <foreignObject x="48" y="460" width="904" height="62"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:400;line-height:1.45;color:#203047;text-align:start;overflow-wrap:anywhere"><span data-source-label="19">根据《刑法》第232条，故意杀人罪处死刑、无期徒刑或十年以上有期徒刑；</span> <span data-source-label="20">情节较轻的，处三年以上十年以下有期徒刑。</span></div></foreignObject>
      </g></svg>