"#7c92af" stroke-width="1.5"/><foreignObject x="124" y="292" width="344" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="3">快思考 ~500ms（思考关闭）</span></div></foreignObject><foreignObject x="124" y="337" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="4">&quot;价格不错，建议购买&quot;</span></div></foreignObject></g><g data-thought-path="slow-thinking"><rect x="512" y="272" width="384" height="113" rx="8" fill="#344964" stroke="#7c92af" stroke-width="1.5"/><foreignObject x="532" y="292" width="344" height="31"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="5">慢思考 ~8s（思考开启）</span></div></foreignObject><foreignObject x="532" y="337" width="344" height="28"><div xmlns="http://www.w3.org/1999/xhtml" dir="ltr" style="box-sizing:border-box;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.45;color:#e4ebf5;text-align:center;overflow-wrap:anywhere"><span data-source-label="6">&quot;缺少国际漫游，不太适合&quot;</span></div></foreignObject></g></g><path data-edge="input-to-parallel-thinking" data-from="user-input" data-to="parallel-thinking" data-route="gutter" data-card-gap-start="8" data-card-gap-end="8" data-gutter-size="64" d="M500 145 L500 193" fill="none" stroke="#7c92af" stroke-width="2" marker-end="url(#ch3-arrow)"/><g data-node="user-experience"><rect x="200" y="493" width="600" height=