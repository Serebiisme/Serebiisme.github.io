<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 870" width="980" height="870" role="img" aria-labelledby="title" style="background:#1e2836"><style>svg{background:#171e29!important;--figure-ink:#e4ebf5;--figure-inverse:#172131} body{background:#171e29!important} line,path,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
  <title id="title">上下文 窗口</title>
